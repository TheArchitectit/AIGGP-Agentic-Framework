# spec: GLF-01
# Reusable GitLab CI template mirroring templates/github-workflows/specs.yml

default:
  image: ghcr.io/aiggp/devgate-runner@sha256:4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
  tags:
    - aiggp-self-hosted

specs:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: recursive
    OPENSPEC_PACKAGE: "@fission-ai/openspec@1.14.3"
  script:
    - npm install --no-save --no-audit --no-fund "$OPENSPEC_PACKAGE"
    - npx openspec validate --all --strict
    - bash "${DEVGATE_DIR:-.devgate}/scripts/specs-validate-negative-control.sh"
    - python3 "${DEVGATE_DIR:-.devgate}/scripts/spec_traceability.py" --root . --ratchet
    - python3 "${DEVGATE_DIR:-.devgate}/scripts/spec_gap_scan.py" --root . --write-report || true
