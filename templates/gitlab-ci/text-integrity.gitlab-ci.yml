# spec: GLF-01
# Reusable GitLab CI template mirroring templates/github-workflows/text-integrity.yml

include:
  - local: '/templates/gitlab-ci/includes/devgate-bootstrap.yml'

default:
  image: ghcr.io/aiggp/devgate-runner@sha256:4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
  tags:
    - aiggp-self-hosted

text-integrity:
  extends: .devgate-bootstrap
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: recursive
    DEVGATE_REQUIRED_PATHS: "scripts/check_charset.py scripts/check_corruption.py scripts/check_encoding.py"
  script:
    - python3 "${DEVGATE_DIR:-.devgate}/scripts/check_charset.py" --repo .
    - python3 "${DEVGATE_DIR:-.devgate}/scripts/check_encoding.py" --repo .
    - python3 "${DEVGATE_DIR:-.devgate}/scripts/check_corruption.py" --repo . --range "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}..HEAD"
