name: Reference Consumer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  behavior:
    name: Synthetic source behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout consumer code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Record checkout identity
        run: |
          set -euo pipefail
          echo "runner label: ubuntu-latest"
          echo "runner OS: $RUNNER_OS"
          echo "event: $GITHUB_EVENT_NAME"
          echo "requested revision: $GITHUB_SHA"
          echo "checked out revision: $(git rev-parse HEAD)"
      - name: Run behavior tests
        run: python3 tests/run_tests.py
      - name: Exercise application entry point
        run: |
          set -euo pipefail
          python3 app.py 21
          if python3 app.py -1; then
            echo "negative input unexpectedly succeeded" >&2
            exit 1
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
          fi
