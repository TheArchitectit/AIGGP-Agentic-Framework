# Secret Validation — Reusable CI Template
#
# Fails the build when a commit adds a credential. Detection is a pinned
# gitleaks release, installed from the vendor's release page and verified
# against the published checksum before it runs — not a marketplace scanning
# action, so there is no third-party action to trust, no licence question for
# organisation-owned repositories, and the same workflow runs on GitHub-hosted
# or self-hosted runners.
#
# Findings are reported by rule, path, line and commit — never by value. A
# scanner that prints the matched secret into CI logs has published it a second
# time, to a wider audience than the commit did.
#
# SETUP
#   1. Copy this file to .github/workflows/secret-validation.yml
#   2. Copy the gate next to it, and keep it executable:
#          scripts/secret-scan.sh        (chmod +x)
#      The workflow is a thin caller on purpose: the behaviour you adopt is the
#      behaviour DevGate tests, rather than a second implementation of it.
#   3. Audit what you already have, once, by hand:
#          bash scripts/secret-scan.sh --all
#      This job scans only the pushed range, so a credential that predates it
#      stays invisible. If that sweep finds one: rotate it. If it is a false
#      positive, disposition it in .guardrails/secret-allowlist.json with a
#      rule, a path and a reason. Never by disabling the rule, and never by
#      excluding a path class — docs are where real credentials get pasted.
#   4. Self-hosted runners: set `runs-on` to your label(s). A runner that
#      already carries the pinned scanner is used without fetching anything
#      (this is the DevGate fleet path — install the pinned binary once, out of
#      band, and every repo on that runner scans without a download).
#
# REMOVED FROM THE PREVIOUS TEMPLATE, deliberately:
#   - `gitleaks/gitleaks-action@v2` — a third-party marketplace action, wanted a
#     licence for organisations, and assumed a GitHub-hosted runner.
#   - the "hardcoded secrets" grep job — it echoed the matched LINE into the log,
#     which republishes the secret, and it never failed the build (it counted
#     matches and printed a warning), so it protected nothing.
#   - the credential-file job — warn-only for the same reason.
#   Do not re-add them. The gitleaks ruleset covers credential-shaped strings
#   without printing them, and the .env check below covers the case it cannot: a
#   committed .env whose contents are not key-shaped.

name: Secret Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (pinned gitleaks over the pushed range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The pushed range is resolved locally and the no-base fall-back walks
          # the history; a shallow clone would scan less than it claims to.
          fetch-depth: 0

      - name: Gate present (fail closed — a missing gate is not a passing scan)
        run: |
          set -eu
          if [ ! -f scripts/secret-scan.sh ]; then
            echo "FAIL: scripts/secret-scan.sh is missing."
            echo "It is step 2 of this workflow's SETUP header — copy it from"
            echo "templates/github-workflows/ next to this file. Until it is"
            echo "there, this job cannot scan anything, and a scan that did not"
            echo "run is not a clean repository."
            exit 1
          fi

      - name: Provide the pinned scanner (checksum-verified when fetched)
        run: |
          set -eu
          # Keep this version and checksum in step with this repository's own
          # .github/workflows/ci.yml — a test asserts the two agree, so a bump
          # cannot land in one place and be forgotten in the other.
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if command -v gitleaks >/dev/null 2>&1; then
            echo "using the scanner already on PATH: $(command -v gitleaks)"
            exit 0
          fi
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSL -o gitleaks.tar.gz "${URL}/gitleaks_${VERSION}_linux_x64.tar.gz"
          # Refuse to run bytes the pin does not name.
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: The scanner is the pinned version
        run: |
          set -eu
          VERSION=8.30.1
          got="$(gitleaks version)"
          echo "gitleaks version: $got"
          case "$got" in
            *"$VERSION"*) ;;
            *) echo "FAIL: gitleaks reports '$got', not $VERSION"; exit 1 ;;
          esac

      - name: Secret scan (the pushed range; the history when there is no base)
        env:
          EV_BEFORE: ${{ github.event.before }}
          EV_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            ARGS=(--range "${PR_BASE}..${PR_HEAD}")
          elif [ -n "${EV_BEFORE:-}" ] && [ -n "${EV_AFTER:-}" ]; then
            ARGS=(--range "${EV_BEFORE}..${EV_AFTER}")
          else
            echo "::notice::no range in this event's payload — sweeping the full history"
            ARGS=(--all)
          fi
          rc=0
          out="$(bash scripts/secret-scan.sh --repo "$GITHUB_WORKSPACE" \
                   --report "$RUNNER_TEMP/secret-scan.json" "${ARGS[@]}" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # Non-vacuity: the gate names its scope before it scans. A job that
          # passes because the gate never ran is the failure this whole workflow
          # exists to prevent, so assert the run happened, not just the exit code.
          printf '%s\n' "$out" | grep -q '^\[secret-scan\] scope:' || {
            echo "FAIL: the gate never reported a scope — it did not run."
            exit 1
          }
          exit "$rc"

      - name: Redacted report (locations only — no matched values)
        if: always()
        run: |
          R="$RUNNER_TEMP/secret-scan.json"
          [ -f "$R" ] && cat "$R" || echo "no report written (the gate did not get that far)"

  check-env-files:
    name: Check for .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Prints filenames only — never contents. A committed .env is a leak even
      # when its contents are not key-shaped enough for a ruleset to catch.
      - name: No committed .env files
        run: |
          set -eu
          ENV_FILES="$(find . -name '.env*' ! -name '.env.example' \
                        ! -name '.env.template' ! -name '.env.sample' \
                        -not -path './.git/*' -type f 2>/dev/null || true)"
          if [ -n "$ENV_FILES" ]; then
            echo "FAIL: .env files are committed:"
            echo "$ENV_FILES"
            echo "Remove them, rotate anything they held, and add them to .gitignore."
            exit 1
          fi
          echo "No committed .env files."
