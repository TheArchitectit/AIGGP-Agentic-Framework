# Specs Validation — Reusable CI Template
#
# Hard gate for a repository's OpenSpec tree (`openspec/`): strict format
# validation, a negative control that proves the validator can REFUSE malformed
# material, and requirement-ID traceability. This is the consumer-facing
# counterpart to DevGate's own `specs` job; the tooling lives in `.devgate/`,
# the tree being validated is the consumer's.
#
# WHAT IT DOES
#   1. `openspec validate --all --strict` over the whole tree — hard gate. The
#      non-vacuity guard fails the step if it validates zero items, because a
#      gate that evaluated nothing must not read as green.
#   2. The negative control (`spec-fmt-04`): stages a known-malformed spec and
#      requires strict validation to reject it, naming the designed defect. A
#      passing tree only proves the tree is well-formed, not that the validator
#      would refuse anything; this proves the gate can fail.
#   3. Requirement-ID traceability (`spec_traceability.py`), advisory by default
#      — a requirement with no `// spec: <id>` marker in source is reported,
#      not failed, until `openspec/gate-config.json` marks a capability
#      `"blocking"`.
#   4. Spec gap scan (`spec_gap_scan.py`), advisory — the ranked inventory of
#      un-specced capabilities with evidence pointers. advisory here means
#      ADVISORY: the exit code is reported, never gated, including the honest
#      exit 2 `unknown scope` for repos whose layout the inventory roots do
#      not match. `--fail-on-gaps` exists and stays OFF at first; a repo opts
#      in deliberately once its scaffold set has been reviewed (SGA-02/07).
#
# SETUP:
#   - Add `.devgate/` to the consumer `.gitignore` and replace the workflow's
#     `DEVGATE_SHA` placeholder with a reviewed, full 40-character commit.
#   - Copy this file into your repo at `.github/workflows/specs.yml`.
#   - CUSTOMIZE (1/2): the `runs-on` label. The template defaults to
#     `ubuntu-latest`; use your self-hosted label where there are no hosted
#     minutes.
#   - CUSTOMIZE (2/2): the pinned CLI version under `env:`. Keep the pin and
#     the negative control a pair — bump deliberately and re-run the control
#     when you do.

name: Specs

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

# Replace this with the consumer-reviewed full commit before installing the
# template. Keeping the pin in the workflow makes updates visible in code review.
env:
  DEVGATE_SHA: REPLACE_WITH_REVIEWED_FULL_40_HEX_COMMIT
  DEVGATE_SOURCE_URL: https://github.com/TheArchitectit/AIGGP-Agentic-Framework.git

jobs:
  specs:
    name: Specs (openspec strict + traceability)
    # CUSTOMIZE (1/2): runner. Replace with your self-hosted label if needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # CUSTOMIZE (2/2): pinned CLI. The gate's rules must not float.
      OPENSPEC_PACKAGE: "@fission-ai/openspec@1.14.3"

    steps:
      - name: Checkout consumer code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Bootstrap pinned DevGate
        run: |
          set -euo pipefail
          bootstrap_fail() { echo "::error::DevGate bootstrap: $1"; exit 1; }
          root=$(pwd -P)
          consumer_root=$(git rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail "cannot resolve the consumer Git root"
          [ "$consumer_root" = "$root" ] || bootstrap_fail "job is not at the consumer Git root"
          [ -n "${DEVGATE_SHA:-}" ] && [[ "$DEVGATE_SHA" =~ ^[0-9a-f]{40}$ ]] || bootstrap_fail "replace the workflow-level DEVGATE_SHA placeholder with a reviewed full lowercase commit SHA"
          git check-ignore --quiet --no-index -- .devgate/ || bootstrap_fail ".devgate/ must be ignored by the consumer"
          tracked_devgate=$(git ls-files -- .devgate 2>/dev/null) || bootstrap_fail "cannot inspect tracked DevGate paths"
          [ -z "$tracked_devgate" ] || bootstrap_fail ".devgate/ must not be tracked"
          [ ! -L .devgate ] || bootstrap_fail ".devgate must not be a symlink"
          source_url=${DEVGATE_SOURCE_URL:-https://github.com/TheArchitectit/AIGGP-Agentic-Framework.git}
          case "$source_url" in *://*@*) bootstrap_fail "DEVGATE_SOURCE_URL must not contain credentials" ;; esac
          if [ -e .devgate ]; then
            checkout_root=$(git -C .devgate rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail "existing .devgate is not a complete Git checkout"
            [ "$checkout_root" = "$root/.devgate" ] || bootstrap_fail "existing .devgate is not a checkout rooted at .devgate"
            actual=$(git -C .devgate rev-parse HEAD 2>/dev/null) || bootstrap_fail "existing .devgate has no checked-out commit"
            [ "$actual" = "$DEVGATE_SHA" ] || bootstrap_fail "existing .devgate is not at DEVGATE_SHA"
            origin=$(git -C .devgate remote get-url origin 2>/dev/null) || bootstrap_fail "existing .devgate has no origin"
            [ "$origin" = "$source_url" ] || bootstrap_fail "existing .devgate has the wrong source"
            checkout_status=$(git -C .devgate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null) || bootstrap_fail "cannot inspect existing .devgate state"
            [ -z "$checkout_status" ] || bootstrap_fail "existing .devgate is dirty"
          else
            git init --quiet .devgate || bootstrap_fail "could not initialize .devgate"
            git -C .devgate remote add origin "$source_url" || bootstrap_fail "could not configure DevGate source"
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C .devgate fetch --quiet --no-tags --depth=1 origin "$DEVGATE_SHA" || bootstrap_fail "could not fetch the pinned DevGate commit"
            git -C .devgate -c core.autocrlf=false checkout --quiet --detach FETCH_HEAD || bootstrap_fail "could not check out the pinned DevGate commit"
          fi
          checkout_root=$(git -C .devgate rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail ".devgate is not a Git checkout"
          [ "$checkout_root" = "$root/.devgate" ] || bootstrap_fail ".devgate has the wrong checkout root"
          actual=$(git -C .devgate rev-parse HEAD 2>/dev/null) || bootstrap_fail ".devgate has no checked-out commit"
          [ "$actual" = "$DEVGATE_SHA" ] || bootstrap_fail ".devgate HEAD does not match DEVGATE_SHA"
          git -C .devgate cat-file -e "$DEVGATE_SHA^{commit}" || bootstrap_fail "DEVGATE_SHA is not a commit"
          checkout_status=$(git -C .devgate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null) || bootstrap_fail "cannot inspect .devgate worktree state"
          [ -z "$checkout_status" ] || bootstrap_fail ".devgate worktree is not clean"
          for required in .guardrails/scope.json scripts/specs-validate-negative-control.sh scripts/spec_traceability.py scripts/spec_gap_scan.py scripts/lib/spec_discovery.py tests/fixtures/malformed-spec/spec.md; do
            [ ! -L ".devgate/$required" ] && [ -f ".devgate/$required" ] || bootstrap_fail "required DevGate file is missing or unsafe: $required"
            git -C .devgate ls-files --error-unmatch -- "$required" >/dev/null 2>&1 || bootstrap_fail "required DevGate file is not tracked: $required"
            pinned_blob=$(git -C .devgate rev-parse --verify "$DEVGATE_SHA:$required" 2>/dev/null) || bootstrap_fail "required DevGate file is absent from DEVGATE_SHA: $required"
            actual_blob=$(git -C .devgate hash-object --no-filters -- "$required" 2>/dev/null) || bootstrap_fail "cannot hash required DevGate file: $required"
            [ "$actual_blob" = "$pinned_blob" ] || bootstrap_fail "required DevGate file content does not match DEVGATE_SHA: $required"
          done
          echo "DevGate ready at $DEVGATE_SHA under .devgate/"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install openspec CLI (pinned)
        run: npm install --no-save --no-audit --no-fund "$OPENSPEC_PACKAGE"

      # Hard gate. PINNED ON PURPOSE: an unpinned CLI moves the gate under the
      # tree whenever upstream publishes — a relaxation could turn a red tree
      # green with no commit on our side.
      - name: openspec validate (strict, hard gate)
        run: |
          set -uo pipefail
          out="$(npx openspec validate --all --strict 2>&1)"; status=$?
          printf '%s\n' "$out"
          passed="$(printf '%s\n' "$out" | grep -cE '^✓ ' || true)"
          if [ "$status" -ne 0 ]; then
            echo "::error::openspec strict validation failed (exit $status)"
            exit 1
          fi
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::strict validation passed 0 items — a gate that evaluates nothing is not green"
            exit 1
          fi
          echo "openspec strict validation passed ${passed} item(s)"

      # The control must exercise the SAME pinned CLI the gate above resolves.
      # It finds it under the project root by layout, so this works whether
      # DevGate is standalone or vendored at .devgate/.
      - name: strict validation refuses malformed material (negative control)
        run: bash .devgate/scripts/specs-validate-negative-control.sh

      - name: Requirement-ID traceability
        run: |
          # pipefail so a traceability failure is not masked by `tail` (the
          # default Actions shell lacks it; a ratchet regression would read green).
          set -o pipefail
          python3 .devgate/scripts/spec_traceability.py --root . --report | tail -8
          python3 .devgate/scripts/spec_traceability.py --root . | tail -2
          # Enforcement, not just a report: --ratchet fails when covered
          # requirement IDs drop below .guardrails/traceability-ratchet.json
          # (initialized on first run if absent).
          python3 .devgate/scripts/spec_traceability.py --root . --ratchet

      - name: Spec gap scan (advisory)
        # Advisory ON PURPOSE (--fail-on-gaps deliberately absent): the gap
        # table ranks what is not yet specced; a repo adopting specs for the
        # first time would red-flag its own CI before any review happened.
        # Flip the flag in your own lane only after the scaffold set lands as
        # reviewed specs. The `|| true` also swallows the honest exit 2 —
        # "unknown scope" on a repo with no capability anchors is information,
        # not a build failure, at this stage.
        run: |
          set -o pipefail
          python3 .devgate/scripts/spec_gap_scan.py --root . --write-report | tail -30 || true
