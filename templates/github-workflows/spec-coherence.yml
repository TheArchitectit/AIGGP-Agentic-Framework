# Spec Coherence — Pinned CI Invocation Template
#
# The gate is the SERVICE, not this file. This workflow resolves the pinned
# runtime, invokes the same protocol local and fleet execution use
# (`python -m hub.coherence`), and reports the decision. Repository content
# MUST NOT appear here as gate logic (coh-int-01) — a workflow that recomputes
# an assertion is a second implementation of the contract, free to disagree
# with the first.
#
# The hub watches this workflow by NAME (config `coherence_workflow_match`,
# default "coherence"), polls its latest run on the configured watched
# branches, and alerts when the run is red, stale, SKIPPED, or absent. That
# is why the name matters and why deleting this file is not an escape: absence
# is itself the alert (coh-pol-07).
#
# WHAT IT DOES
#   1. Resolves the pinned runtime: clones DevGate at a fixed commit into
#      .devgate/ and reads the execution-profile registry there. Nothing is
#      resolved from this repository's content.
#   2. Optionally verifies the host can run the pinned image (doctor phase).
#   3. Runs the gate and reports it as a job summary table with ONE row per
#      requested subject, so no subject can vanish silently.
#
# THE GATE EITHER RUNS OR SAYS WHY NOT (coh-int-06)
#   Every non-executed phase records `SKIPPED (reason)` in the summary and
#   exits non-zero. A skip is never green and never a neutral: "the gate did
#   not run here" is a fact the fleet needs, and a workflow that exits 0
#   having evaluated nothing is the failure this contract exists to prevent.
#
# SETUP
#   - Copy to .github/workflows/spec-coherence.yml in a repo whose runner is
#     enrolled. RUNNER LABELS ARE REPO-SCOPED, not fleet-wide: measured
#     2026-09-24 (infra-info @3e156ba) the framework registers `devgate`,
#     gamerepo01 `devgate-game`, rad-gateway `devgate-radgateway`. Set the
#     repository variable DEVGATE_RUNNER_LABEL to THIS repo's label. If it names
#     a label no runner carries the job does not fail — it QUEUES FOREVER and
#     reports nothing at all, so the gate looks absent rather than broken. Unset,
#     it falls back to `devgate` (correct on this framework, wrong elsewhere).
#   - CUSTOMIZE the values under `env:` below: the pin, the pinned image digest,
#     and the subjects to gate — plus DEVGATE_RUNNER_LABEL as a repo variable.
#   - The runner must have podman and the pinned image already present. The
#     container phase is host-side: the image is NOT pulled here, because a
#     pull would make the executed bytes depend on the network rather than on
#     the registry pin (coh-rt-01). Absent image => SKIPPED with that reason.

name: Spec Coherence

on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "Space-separated subject roots to gate (default: from env)"
        required: false
        type: string
      doctor:
        description: "Run the host-capability check first (true/false)"
        required: false
        type: string
        default: "true"
  # A coherence gate is only meaningful for the candidate being promoted, so
  # the natural trigger is the promotion path. Wire this to whatever this repo
  # uses to nominate a candidate; workflow_dispatch is always available.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spec-coherence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coherence:
    name: "Spec coherence gate"
    # Repo-scoped, so it is read from a repo variable with the historical
    # default as fallback — see SETUP. A label no runner carries queues
    # forever; drift-scan.yml resolves the same problem by reading the repo's
    # own declared labels.
    runs-on: ${{ vars.DEVGATE_RUNNER_LABEL || 'devgate' }}
    timeout-minutes: 20

    env:
      # CUSTOMIZE (1/4): the pinned runtime. Same shape as drift-scan.yml —
      # clone then checkout a fixed commit, so the gate's own code is
      # addressed by content, not by whatever HEAD happens to be. This commit
      # MUST contain hub/coherence/invoke.py (the request builder this gate now
      # calls) AND the container/execution-profiles.json whose digest the pins
      # below name — the digest step reads the registry out of THIS tree, so a
      # pin that predates a re-pin fails closed with "pinned digest … is not
      # the registry's …". Moving the pin and the digest is one operation.
      # This pin (round-18 R2) points at the first commit whose tree carries
      # the published identity f470110c…; verified by checking that commit out
      # and running the digest step's own resolution against its registry.
      DEVGATE_REPO: https://github.com/TheArchitectit/DevGate-Agentic-Framework.git
      DEVGATE_PIN: 960682f619873bf94afacbebe67f34d501364376
      # CUSTOMIZE (2/4): the pinned evaluator image. What is pinned is the
      # DIGEST, not the tag — the driver refuses a ref/digest disagreement, so
      # a stale copy of these two lines fails closed in the summary rather
      # than running unpinned bytes. Keep BOTH lines equal to what the pinned
      # clone records in .devgate/container/execution-profiles.json for the
      # profile below (a test enforces the agreement, and the QA on
      # 2026-09-23 found the field was carrying a build-time config digest —
      # `podman image inspect` of a locally built image — which no registry
      # can serve; the value below is the image MANIFEST digest ghcr actually
      # resolves, i.e. the one `podman pull image@digest` can fetch).
      COHERENCE_IMAGE: ghcr.io/thearchitectit/devgate-agentic-framework/devgate-coherence
      COHERENCE_PROFILE: linux-amd64-v1
      COHERENCE_IMAGE_MANIFEST_DIGEST: sha256:f470110ce0caa14bb78eabc633c1bbbf63aeb9f49b15e50cd5866788964f2c6c
      # CUSTOMIZE (3/4): what to gate. Subjects are directories in THIS repo
      # that declare a coherence package. An EMPTY list is not a pass.
      COHERENCE_SUBJECTS: ""
      # CUSTOMIZE (4/4): the control-plane inputs. These are NOT repository
      # content — policy and context are issued by the control plane, and the
      # openspec package is the change-package root the subject is promoted
      # against. Left EMPTY here on purpose: a gate that cannot build a request
      # because its inputs were not provisioned reports SKIPPED (non-green),
      # which is the honest state; a fabricated root would evaluate the wrong
      # thing and look like a pass. Phase 3 (design.md) replaces these
      # provisioned paths with an authenticated hub fetch.
      COHERENCE_OPENSPEC_ROOT: ""
      COHERENCE_POLICY_ROOT: ""
      COHERENCE_CONTEXT_ROOT: ""
      # Doctor phase severity. Set to `error` in a repo where a host that
      # cannot run the pinned image must fail the gate rather than warn.
      COHERENCE_DOCTOR_LEVEL: warning

    steps:
      - name: Checkout candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)

      # No setup-node here, unlike drift-scan.yml: this gate is stdlib-only
      # Python by contract (design.md), and a coherence gate that needs a
      # language runtime installed to run the check would be reimplementing
      # logic the service already owns.

      - name: Resolve pinned runtime
        id: pin
        run: |
          set -euo pipefail
          if [ ! -d .devgate ]; then
            echo "::error::no pinned runtime. The container phase is unavailable."
            { echo "## Spec Coherence"; echo ""; echo "| Subject | Result |"; echo "|---|---|";
              echo "| (runtime) | SKIPPED (pinned runtime not provisioned) |"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          PINNED="$(git -C .devgate rev-parse HEAD)"
          if [ "$PINNED" != "$DEVGATE_PIN" ]; then
            echo "::error::pinned runtime mismatch: have $PINNED, expected $DEVGATE_PIN"
            exit 1
          fi
          echo "pin=$PINNED" >> "$GITHUB_OUTPUT"

      - name: Bootstrap pinned scanners (in-tree at .devgate/)
        run: |
          set -euo pipefail
          if [ -d .devgate ]; then
            echo "runtime already provisioned at .devgate; leaving it in place"
            exit 0
          fi
          git clone "$DEVGATE_REPO" .devgate
          git -C .devgate checkout "$DEVGATE_PIN"
          echo "cloned $DEVGATE_REPO at $DEVGATE_PIN"

      - name: Doctor — can this host run the pinned image?
        id: doctor
        if: ${{ (inputs.doctor || 'true') == 'true' }}
        run: |
          set -uo pipefail
          REASON=""
          if ! command -v podman >/dev/null 2>&1; then
            REASON="podman not on PATH"
          elif ! podman image exists "$COHERENCE_IMAGE@$COHERENCE_IMAGE_MANIFEST_DIGEST" 2>/dev/null; then
            # Digest-qualified on purpose. Measured 2026-09-23: a BARE name
            # resolves to `:latest`, so the previous `podman image exists
            # "$COHERENCE_IMAGE"` reported "not present" on a host that
            # plainly had the image (rc=1 with the pinned ref present,
            # rc=0 for the qualified one) — the doctor was inert in the
            # direction that matters. And present-by-name is not
            # present-by-identity: another build of the same tag must not
            # pass, since the driver executes the DIGEST. No pull here by
            # design (coh-rt-01): the executed bytes come from provisioning,
            # not from the network at gate time.
            REASON="pinned image $COHERENCE_IMAGE@$COHERENCE_IMAGE_MANIFEST_DIGEST not present locally (not pulled by design)"
          fi
          if [ -n "$REASON" ]; then
            echo "::${COHERENCE_DOCTOR_LEVEL}::container phase unavailable: $REASON"
            echo "doctor=unavailable" >> "$GITHUB_OUTPUT"
            echo "doctor_reason=$REASON" >> "$GITHUB_OUTPUT"
          else
            echo "doctor=ok" >> "$GITHUB_OUTPUT"
          fi

      # THE REQUEST AND LAUNCH CONFIG ARE BUILT BY THE SERVICE, NOT THIS SHELL.
      # This is the round-18 lesson made structural: a heredoc here once emitted
      # three of the seven request fields and hand-mounted only the subject, so
      # the gate died on its own input before any assertion ran. Assembly now
      # lives in `hub.coherence.invoke` — inside the pinned clone, and inside
      # the image (COPY hub/), so CI and a local run execute the identical
      # builder bytes and CI emits a schema-valid seven-field request with four
      # read-only mounts. The shell's only jobs are: run the builder, run the
      # driver, report the verdict. It assembles no payload and computes no
      # digest (coh-int-01: a second implementation of the contract is free to
      # disagree with the first).
      #
      # The driver invocation is `-m hub.coherence --launch-config`, the
      # host-side containerized driver: it validates the builder's launch config
      # against the PINNED registry, executes the digest-pinned image with
      # network=none and a read-only rootfs, and relays the container's own exit
      # code and canonical result untouched (coh-rt-01/05/07, coh-dec-04).
      - name: Run coherence gate
        id: gate
        run: |
          set -uo pipefail

          # Resolution order: explicit dispatch input, then the env default.
          SUBJECTS="${{ inputs.subjects }}"
          SUBJECTS="${SUBJECTS:-$COHERENCE_SUBJECTS}"

          declare -A RES
          FAIL=0
          note() { RES["$1"]="$2"; }

          # No subjects is a hard stop, not an empty sweep. A gate that
          # evaluated nothing and exited 0 would be indistinguishable from a
          # passing gate in every downstream consumer (coh-int-06).
          if [ -z "${SUBJECTS// /}" ]; then
            note "(all)" "SKIPPED (no subjects configured; set COHERENCE_SUBJECTS or the subjects input)"
            FAIL=1
          fi

          # Resolve the digest from the PINNED registry, then compare it with
          # the configuration's expectation. Both directions matter: a config
          # pointing at other bytes must not run, and a config whose pinned
          # digest is no longer what the registry says must not run either
          # (the driver refuses the ref/digest disagreement itself, but the
          # summary should say which of the two drifted).
          DIGEST="$(python3 -c "
          import json
          reg = json.load(open('.devgate/container/execution-profiles.json'))
          want = '$COHERENCE_PROFILE'
          for p in reg.get('profiles', []):
              if p.get('label') == want:
                  print(p['image_manifest_digest']); raise SystemExit(0)
          ")"
          if [ -z "$DIGEST" ]; then
            note "(all)" "SKIPPED (profile $COHERENCE_PROFILE absent from the pinned registry)"
            FAIL=1
          elif [ "$DIGEST" != "$COHERENCE_IMAGE_MANIFEST_DIGEST" ]; then
            note "(all)" "SKIPPED (pinned digest $COHERENCE_IMAGE_MANIFEST_DIGEST is not the registry's $DIGEST)"
            FAIL=1
          fi

          if [ -n "${SUBJECTS// /}" ] && [ -n "$DIGEST" ] \
             && [ "$DIGEST" = "$COHERENCE_IMAGE_MANIFEST_DIGEST" ]; then
            if [ "${{ inputs.doctor }}" = "true" ] \
               && [ "${{ steps.doctor.outputs.doctor }}" != "ok" ]; then
              note "(all)" "SKIPPED (host cannot run the pinned image: ${{ steps.doctor.outputs.doctor_reason }})"
              FAIL=1
            else
              # policy and context are control-plane artifacts, not repository
              # content — provisioned out of band for now (Phase 3: the hub
              # serves them authenticated, design.md). The openspec package is
              # the change-package root the subject is promoted against. Absent
              # any of them the gate cannot build a request and says so; it does
              # NOT invent roots from candidate content (that would be
              # repository content deciding what runs).
              if [ -z "$COHERENCE_OPENSPEC_ROOT" ] || [ -z "$COHERENCE_POLICY_ROOT" ] \
                 || [ -z "$COHERENCE_CONTEXT_ROOT" ]; then
                note "(all)" "SKIPPED (control-plane inputs not provisioned: set COHERENCE_OPENSPEC_ROOT / _POLICY_ROOT / _CONTEXT_ROOT)"
                FAIL=1
              else
                for SUBJECT in $SUBJECTS; do
                  if [ ! -d "$SUBJECT" ]; then
                    note "$SUBJECT" "SKIPPED (subject root not found)"
                    FAIL=1
                    continue
                  fi
                  CAND_ROOT="$PWD"
                  OUT="$RUNNER_TEMP/coherence-$(echo "$SUBJECT" | tr '/.' '--')"
                  mkdir -p "$OUT"
                  # Build the request + launch config. Running from .devgate so
                  # the module import resolves to the PINNED clone, never to a
                  # candidate-local `hub/` that could shadow it; every path
                  # passed is absolute so the cd cannot corrupt a root.
                  if ! (cd .devgate && PYTHONPATH=. python3 -m hub.coherence.invoke \
                          --subject "$CAND_ROOT/$SUBJECT" \
                          --openspec "$COHERENCE_OPENSPEC_ROOT" \
                          --policy "$COHERENCE_POLICY_ROOT" \
                          --context "$COHERENCE_CONTEXT_ROOT" \
                          --outputs "$OUT" \
                          --image "$COHERENCE_IMAGE" --profile "$COHERENCE_PROFILE" \
                          --manifest-digest "$DIGEST" \
                          --request-id "$SUBJECT" \
                          --request-out "$OUT/request.json" \
                          --launch-out "$OUT/launch.json") \
                       > "$OUT/build.log" 2>&1; then
                    note "$SUBJECT" "FAIL (inputs rejected by the builder; see build.log)"
                    FAIL=1
                    continue
                  fi
                  if (cd .devgate && PYTHONPATH=. python3 -m hub.coherence \
                        --request "$OUT/request.json" \
                        --launch-config "$OUT/launch.json") \
                       > "$OUT/stdout.log" 2> "$OUT/stderr.log"; then
                    note "$SUBJECT" "PASS"
                  else
                    CODE=$?
                    note "$SUBJECT" "FAIL (exit $CODE)"
                    FAIL=1
                  fi
                done
              fi
            fi
          fi

          {
            echo "## Spec Coherence"
            echo ""
            echo "| Subject | Result |"
            echo "|---------|--------|"
            echo "| (runtime) | DevGate@${DEVGATE_PIN} OK |"
            for s in "${!RES[@]}"; do echo "| $s | ${RES[$s]} |"; done
            echo ""
            echo "Image: ${COHERENCE_IMAGE} (profile ${COHERENCE_PROFILE}, digest ${DIGEST:-unresolved})"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAIL
