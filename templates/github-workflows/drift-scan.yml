# Drift Scan — Reusable Scheduled CI Template
#
# Scheduled scans catch DRIFT: changes that never arrive as a push or PR —
# dependency updates that landed and aged, base-image/toolchain drift on a
# self-hosted runner, CI-config edits, secret-shaped content that slipped into
# history — plus anything a PR-time gate would have caught but didn't because
# it ran before the offending change merged.
#
# This workflow does two things on a schedule (and on demand):
#   1. HOST-AWARE TARGETING — runs .devgate/scripts/detect-host-ci.py to read
#      THIS repo's own `runs-on:` labels and `schedule:` crons (secrets-
#      redacted). The scan then runs on the host's declared self-hosted runner
#      instead of a hardcoded `ubuntu-latest`. If the host declares no label,
#      it falls back to `ubuntu-latest`.
#   2. FULL-TREE GATE SUITE — runs DevGate's scanners against the whole tree
#      (not a diff), so pre-existing code that was added before a gate existed
#      is re-swept: guardrails pattern scan, semantic scan (skips if no
#      TS/JS), regression check (--all: full tree), and the silent-success
#      scan. Gate results are written to the job summary.
#
# SETUP:
#   - Ignore `.devgate/` in `.gitignore`.
#   - Set `DEVGATE_SHA` to a reviewed full commit SHA for `.devgate/`.
#   - Copy this file into your repo at .github/workflows/drift-scan.yml
#   - CUSTOMIZE the cron below (off-round minutes preferred; 04:23 UTC shown).
#   - The host's OTHER schedules are reported by detect-host-ci.py in the
#     summary so you can see cadence collisions at a glance.

name: Drift Scan

on:
  schedule:
    # CUSTOMIZE: nightly full-tree sweep. Avoid :00/:30 (shared CI crunch).
    - cron: '23 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Replace this with the consumer-reviewed full commit before installing the
# template. Keeping the pin in the workflow makes updates visible in code review.
env:
  DEVGATE_SHA: REPLACE_WITH_REVIEWED_FULL_40_HEX_COMMIT
  DEVGATE_SOURCE_URL: https://github.com/TheArchitectit/AIGGP-Agentic-Framework.git

jobs:
  resolve-target:
    name: Resolve host CI target
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.host.outputs.runner }}
      runner_json: ${{ steps.host.outputs.runner_json }}
      crons: ${{ steps.host.outputs.crons }}
    steps:
      - name: Checkout consumer code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA resolved 2026-09-19)

      - name: Bootstrap pinned DevGate for target detection
        run: |
          set -euo pipefail
          bootstrap_fail() { echo "::error::DevGate bootstrap: $1"; exit 1; }
          root=$(pwd -P)
          consumer_root=$(git rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail "cannot resolve the consumer Git root"
          [ "$consumer_root" = "$root" ] || bootstrap_fail "job is not at the consumer Git root"
          [ -n "${DEVGATE_SHA:-}" ] && [[ "$DEVGATE_SHA" =~ ^[0-9a-f]{40}$ ]] || bootstrap_fail "replace the workflow-level DEVGATE_SHA placeholder with a reviewed full lowercase commit SHA"
          git check-ignore --quiet --no-index -- .devgate/ || bootstrap_fail ".devgate/ must be ignored by the consumer"
          tracked_devgate=$(git ls-files -- .devgate 2>/dev/null) || bootstrap_fail "cannot inspect tracked DevGate paths"
          [ -z "$tracked_devgate" ] || bootstrap_fail ".devgate/ must not be tracked"
          [ ! -L .devgate ] || bootstrap_fail ".devgate must not be a symlink"
          source_url=${DEVGATE_SOURCE_URL:-https://github.com/TheArchitectit/AIGGP-Agentic-Framework.git}
          case "$source_url" in *://*@*) bootstrap_fail "DEVGATE_SOURCE_URL must not contain credentials" ;; esac
          if [ -e .devgate ]; then
            checkout_root=$(git -C .devgate rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail "existing .devgate is not a complete Git checkout"
            [ "$checkout_root" = "$root/.devgate" ] || bootstrap_fail "existing .devgate is not a checkout rooted at .devgate"
            actual=$(git -C .devgate rev-parse HEAD 2>/dev/null) || bootstrap_fail "existing .devgate has no checked-out commit"
            [ "$actual" = "$DEVGATE_SHA" ] || bootstrap_fail "existing .devgate is not at DEVGATE_SHA"
            origin=$(git -C .devgate remote get-url origin 2>/dev/null) || bootstrap_fail "existing .devgate has no origin"
            [ "$origin" = "$source_url" ] || bootstrap_fail "existing .devgate has the wrong source"
            checkout_status=$(git -C .devgate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null) || bootstrap_fail "cannot inspect existing .devgate state"
            [ -z "$checkout_status" ] || bootstrap_fail "existing .devgate is dirty"
          else
            git init --quiet .devgate || bootstrap_fail "could not initialize .devgate"
            git -C .devgate remote add origin "$source_url" || bootstrap_fail "could not configure DevGate source"
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C .devgate fetch --quiet --no-tags --depth=1 origin "$DEVGATE_SHA" || bootstrap_fail "could not fetch the pinned DevGate commit"
            git -C .devgate -c core.autocrlf=false checkout --quiet --detach FETCH_HEAD || bootstrap_fail "could not check out the pinned DevGate commit"
          fi
          checkout_root=$(git -C .devgate rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail ".devgate is not a Git checkout"
          [ "$checkout_root" = "$root/.devgate" ] || bootstrap_fail ".devgate has the wrong checkout root"
          actual=$(git -C .devgate rev-parse HEAD 2>/dev/null) || bootstrap_fail ".devgate has no checked-out commit"
          [ "$actual" = "$DEVGATE_SHA" ] || bootstrap_fail ".devgate HEAD does not match DEVGATE_SHA"
          git -C .devgate cat-file -e "$DEVGATE_SHA^{commit}" || bootstrap_fail "DEVGATE_SHA is not a commit"
          checkout_status=$(git -C .devgate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null) || bootstrap_fail "cannot inspect .devgate worktree state"
          [ -z "$checkout_status" ] || bootstrap_fail ".devgate worktree is not clean"
          for required in scripts/detect-host-ci.py; do
            [ ! -L ".devgate/$required" ] && [ -f ".devgate/$required" ] || bootstrap_fail "required DevGate file is missing or unsafe: $required"
            git -C .devgate ls-files --error-unmatch -- "$required" >/dev/null 2>&1 || bootstrap_fail "required DevGate file is not tracked: $required"
            pinned_blob=$(git -C .devgate rev-parse --verify "$DEVGATE_SHA:$required" 2>/dev/null) || bootstrap_fail "required DevGate file is absent from DEVGATE_SHA: $required"
            actual_blob=$(git -C .devgate hash-object --no-filters -- "$required" 2>/dev/null) || bootstrap_fail "cannot hash required DevGate file: $required"
            [ "$actual_blob" = "$pinned_blob" ] || bootstrap_fail "required DevGate file content does not match DEVGATE_SHA: $required"
          done
          echo "DevGate ready at $DEVGATE_SHA under .devgate/"

      - name: Detect host CI / runner info
        id: host
        run: |
          # detect-host-ci.py answers: what runners and schedules does THIS
          # repo already declare? Output is secrets-redacted by design.
          python3 .devgate/scripts/detect-host-ci.py | tee host-ci.json

          # Placement is a JSON array, not a string. detect-host-ci.py reports
          # the host's `runs-on:` values verbatim, and a host that writes a
          # YAML flow sequence (`runs-on: [self-hosted, devgate-rtp]`) makes
          # the whole sequence — brackets and comma included — one extracted
          # value. Asking a runner for the label "[self-hosted, devgate-rtp]"
          # does not fail: the job queues forever and the schedule reports
          # nothing, which reads as a quiet repository. So the labels are split
          # apart here, `${{ ... }}` expressions are skipped (an expression is
          # not a label), and the job consumes the array with fromJSON.
          #
          # Each extracted value is one alternative placement, not one entry in
          # a conjunction: the first usable value wins whole. Merging values
          # would ask for a runner carrying labels from two different jobs at
          # once, which is the same never-queues failure in another shape.
          RUNNER_JSON=$(python3 -c "
          import json
          d = json.load(open('host-ci.json'))
          chosen = []
          for raw in (d.get('runs_on_labels') or []):
              v = str(raw).strip().strip('\"\'')
              if not v or '\${{' in v:
                  continue
              parts = v.strip('[]').split(',') if v.startswith('[') else [v]
              chosen = [p.strip().strip('\"\'') for p in parts]
              chosen = [p for p in chosen if p]
              if chosen:
                  break
          print(json.dumps(chosen or ['ubuntu-latest']))
          ")
          RUNNER=$(printf '%s' "$RUNNER_JSON" | tr -d '[]"')
          CRONS=$(python3 -c "
          import json
          d = json.load(open('host-ci.json'))
          print(' '.join(d.get('scheduled_crons') or []))
          ")
          echo "runner_json=$RUNNER_JSON" >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "crons=$CRONS" >> "$GITHUB_OUTPUT"
          echo "Resolved scan target: $RUNNER"

  drift-scan:
    name: Scheduled drift scan
    needs: resolve-target
    # A flow sequence is a YAML list, not a runner label: fromJSON keeps every
    # declared label, where `labels[0]` as a string would keep none of them.
    runs-on: ${{ fromJSON(needs.resolve-target.outputs.runner_json) }}

    steps:
      - name: Checkout consumer code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA resolved 2026-09-19)
        with:
          # ci-run-01: the regression arm diffs the real tag window
          # (regression_check.py --all resolves the most recent tag), which a
          # depth-1 clone cannot see — an undiffable ref must never read as
          # "the scan found nothing".
          fetch-depth: 0

      - name: Bootstrap pinned DevGate
        run: |
          set -euo pipefail
          bootstrap_fail() { echo "::error::DevGate bootstrap: $1"; exit 1; }
          root=$(pwd -P)
          consumer_root=$(git rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail "cannot resolve the consumer Git root"
          [ "$consumer_root" = "$root" ] || bootstrap_fail "job is not at the consumer Git root"
          [ -n "${DEVGATE_SHA:-}" ] && [[ "$DEVGATE_SHA" =~ ^[0-9a-f]{40}$ ]] || bootstrap_fail "replace the workflow-level DEVGATE_SHA placeholder with a reviewed full lowercase commit SHA"
          git check-ignore --quiet --no-index -- .devgate/ || bootstrap_fail ".devgate/ must be ignored by the consumer"
          tracked_devgate=$(git ls-files -- .devgate 2>/dev/null) || bootstrap_fail "cannot inspect tracked DevGate paths"
          [ -z "$tracked_devgate" ] || bootstrap_fail ".devgate/ must not be tracked"
          [ ! -L .devgate ] || bootstrap_fail ".devgate must not be a symlink"
          source_url=${DEVGATE_SOURCE_URL:-https://github.com/TheArchitectit/AIGGP-Agentic-Framework.git}
          case "$source_url" in *://*@*) bootstrap_fail "DEVGATE_SOURCE_URL must not contain credentials" ;; esac
          if [ -e .devgate ]; then
            checkout_root=$(git -C .devgate rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail "existing .devgate is not a complete Git checkout"
            [ "$checkout_root" = "$root/.devgate" ] || bootstrap_fail "existing .devgate is not a checkout rooted at .devgate"
            actual=$(git -C .devgate rev-parse HEAD 2>/dev/null) || bootstrap_fail "existing .devgate has no checked-out commit"
            [ "$actual" = "$DEVGATE_SHA" ] || bootstrap_fail "existing .devgate is not at DEVGATE_SHA"
            origin=$(git -C .devgate remote get-url origin 2>/dev/null) || bootstrap_fail "existing .devgate has no origin"
            [ "$origin" = "$source_url" ] || bootstrap_fail "existing .devgate has the wrong source"
            checkout_status=$(git -C .devgate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null) || bootstrap_fail "cannot inspect existing .devgate state"
            [ -z "$checkout_status" ] || bootstrap_fail "existing .devgate is dirty"
          else
            git init --quiet .devgate || bootstrap_fail "could not initialize .devgate"
            git -C .devgate remote add origin "$source_url" || bootstrap_fail "could not configure DevGate source"
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C .devgate fetch --quiet --no-tags --depth=1 origin "$DEVGATE_SHA" || bootstrap_fail "could not fetch the pinned DevGate commit"
            git -C .devgate -c core.autocrlf=false checkout --quiet --detach FETCH_HEAD || bootstrap_fail "could not check out the pinned DevGate commit"
          fi
          checkout_root=$(git -C .devgate rev-parse --show-toplevel 2>/dev/null) || bootstrap_fail ".devgate is not a Git checkout"
          [ "$checkout_root" = "$root/.devgate" ] || bootstrap_fail ".devgate has the wrong checkout root"
          actual=$(git -C .devgate rev-parse HEAD 2>/dev/null) || bootstrap_fail ".devgate has no checked-out commit"
          [ "$actual" = "$DEVGATE_SHA" ] || bootstrap_fail ".devgate HEAD does not match DEVGATE_SHA"
          git -C .devgate cat-file -e "$DEVGATE_SHA^{commit}" || bootstrap_fail "DEVGATE_SHA is not a commit"
          checkout_status=$(git -C .devgate status --porcelain --untracked-files=all --ignored=matching 2>/dev/null) || bootstrap_fail "cannot inspect .devgate worktree state"
          [ -z "$checkout_status" ] || bootstrap_fail ".devgate worktree is not clean"
          for required in .guardrails/failure-registry.jsonl .guardrails/scope.json .guardrails/prevention-rules/pattern-rules.json .guardrails/prevention-rules/semantic-rules.json .guardrails/prevention-rules/silent-success-rules.json .guardrails/silent-success-allowlist.json scripts/detect-host-ci.py scripts/guardrails-scan.mjs scripts/semantic-scan.mjs scripts/regression_check.py scripts/silent-success-scan.sh scripts/gate_common.py scripts/gate_overlay.py scripts/regression_audit.py scripts/regression_sizes.py scripts/lib/project_root.py scripts/lib/gate_common.mjs scripts/lib/project-root.mjs; do
            [ ! -L ".devgate/$required" ] && [ -f ".devgate/$required" ] || bootstrap_fail "required DevGate file is missing or unsafe: $required"
            git -C .devgate ls-files --error-unmatch -- "$required" >/dev/null 2>&1 || bootstrap_fail "required DevGate file is not tracked: $required"
            pinned_blob=$(git -C .devgate rev-parse --verify "$DEVGATE_SHA:$required" 2>/dev/null) || bootstrap_fail "required DevGate file is absent from DEVGATE_SHA: $required"
            actual_blob=$(git -C .devgate hash-object --no-filters -- "$required" 2>/dev/null) || bootstrap_fail "cannot hash required DevGate file: $required"
            [ "$actual_blob" = "$pinned_blob" ] || bootstrap_fail "required DevGate file content does not match DEVGATE_SHA: $required"
          done
          echo "DevGate ready at $DEVGATE_SHA under .devgate/"

      - name: Install the semantic scanner's parser (typescript@5)
        # ci-run-01: "WHEN the consumer has TS/JS files THEN the template
        # installs typescript@5 before the semantic arm" — without the
        # compiler API the scanner fails closed on any project that has
        # TS/JS files (v7 dropped the root API, hence the pin).
        run: npm install --no-save --no-audit --no-fund typescript@5

      - name: Run gate suite (full tree)
        run: |
          set +e
          declare -A RESULTS
          run_gate() {
            local name="$1"; shift
            echo "=== $name ==="
            if "$@"; then RESULTS[$name]=PASS; else RESULTS[$name]=FAIL; fi
          }

          run_gate guardrails   node .devgate/scripts/guardrails-scan.mjs
          run_gate semantic     node .devgate/scripts/semantic-scan.mjs
          run_gate regression   python3 .devgate/scripts/regression_check.py --all --pre-commit
          run_gate silent-success bash .devgate/scripts/silent-success-scan.sh

          # Summary: one line per gate, no gate can silently vanish.
          {
            echo "## Drift Scan Results"
            echo ""
            echo "| Gate | Result |"
            echo "|------|--------|"
            for gate in guardrails semantic regression silent-success; do
              echo "| $gate | ${RESULTS[$gate]:-NOT_RUN} |"
            done
            echo ""
            echo "Host CI schedules (from detect-host-ci.py): ${NEEDS_CRONS:-}"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for gate in guardrails semantic regression silent-success; do
            [ "${RESULTS[$gate]}" = "PASS" ] || FAILED=1
          done
          exit $FAILED
        env:
          NEEDS_CRONS: ${{ needs.resolve-target.outputs.crons }}
