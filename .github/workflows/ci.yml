name: CI

# The framework runs its own medicine (fw-ci-01..03): the full test suite,
# the shipped gates against its own tree, and spec validation — on every PR
# and every push to main. Before this workflow existed, nothing executed
# tests/ in CI (QA M9) and a foreign `tests` package could silently drop five
# conformance files from collection without anyone noticing.
#
# Runner targeting: hosted ubuntu-latest (mirrors drift-scan.yml's choice to
# keep the framework's own CI runnable on any fork/PR without fleet access;
# the fleet-labeled runner stays dedicated to consumer drift scans). The
# container-image job never passes silently when podman is missing: the build
# and schema steps say SKIPPED in the log, and the identity gate — the one
# that decides whether consumers can fetch the pinned evaluator — fails
# closed, because "we could not evaluate the pin" is not a pass. That branch
# is future-proofing only: hosted ubuntu-latest ships podman, and the logged
# runs since 2026-09-22 execute the build on every push.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Read by container-publish's `if:`. Declared here because an `if:` that
      # references an undeclared input evaluates to null, the condition is false
      # on every event, and the job silently never runs again — GitHub reports
      # no error for that. test_the_publish_input_is_declared guards it.
      publish:
        description: "Build and push the evaluator image to GHCR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite (Python + Node)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the template's DEVGATE_PIN is checked here against the
      # registry IN THAT COMMIT's tree (test_the_pinned_commit_carries_the_
      # pinned_identity) — a shallow clone cannot see the object and the guard
      # would degrade into a "cannot evaluate" pass.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: pytest suite (collection is deterministic — tests/__init__.py)
        run: python3 -m pytest tests/ -v
      - name: guardrails scanner fixture suite
        run: node tests/test_guardrails_scan.mjs
      # The Python root-anchor suite pins the PYTHON scanners
      # (regression_check / scene_inventory / failure_registry_check). It
      # never superseded the Node fixture below — the comment that claimed
      # otherwise was written when 9c19259 deleted that fixture, and left
      # guardrails/semantic/run-tests' shared root contract pinned by nothing.
      - name: python scanner root-anchoring fixture suite
        run: python3 -m pytest tests/test_python_root_anchor.py -q
      # The Node sibling — deleted by 9c19259 under a container-only commit
      # message, restored 2026-09-26. All three scanner headers name it as
      # the fixture that locks their root contract; without it live here the
      # claim was orphaned. Explicit step (not just runner-collected) keeps
      # the contract visible by name, same as the Python step above.
      - name: node scanner root-anchoring fixture suite
        run: node tests/test_scanner_root_anchor.mjs
      - name: per-file runner (frameworks's own tests through its own runner)
        run: node scripts/run-tests.mjs
      # The runner above exits 0 when it finds nothing, so a broken discovery
      # path would show up as a green step that ran zero tests (the 2026-09-20
      # audit found exactly that: "TOTAL: 0 passed", exit 0). The runner itself
      # now fails closed on zero discovery; this step pins the *outcome* as a
      # number, so a future change that turns discovery back into a no-op has
      # to beat an assertion rather than just print less.
      - name: runner discovered tests (non-vacuity — zero discovery is not a pass)
        run: |
          out="$(node scripts/run-tests.mjs 2>&1)" || { echo "$out"; exit 1; }
          echo "$out" | tail -3
          n="$(printf '%s\n' "$out" | sed -n 's/.*across \([0-9]\+\) files.*/\1/p' | tail -1)"
          if [ -z "$n" ] || [ "$n" -lt 1 ]; then
            echo "FAIL: the runner reported no discovered files — a green test lane that ran nothing."
            exit 1
          fi
          echo "runner discovered $n test file(s)"

  self-gates:
    name: DevGate gates on DevGate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # --base origin/main needs the merge base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install pytest (test floors need collection)
        run: python3 -m pip install --quiet pytest
      - name: Pattern scan (own tree must be warning-clean)
        run: node scripts/guardrails-scan.mjs
      - name: Semantic scan (installs the pinned parser)
        run: |
          npm install --no-save --no-audit --no-fund typescript@5
          node scripts/semantic-scan.mjs
      - name: Regression check (pushed/PR range; zero-input fails)
        run: |
          # PR: merge base against the target branch. Push: the range the
          # push actually added (event.before..HEAD) — using origin/main on a
          # push would diff main against itself, evaluate zero files, and
          # fail this job for the wrong reason.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python3 scripts/regression_check.py --base "$BASE" --fail-if-empty --pre-commit
      - name: Silent-success scan
        run: bash scripts/silent-success-scan.sh
      - name: Failure-registry hygiene
        run: python3 scripts/failure_registry_check.py
      # rule-truth-01 (design D7): an enabled rule with no executing checker
      # is dead coverage presented as live. This gate fails on it, on rules
      # files that no longer validate, and on enabled rules missing a message
      # or severity — the check the 2026-09-13 audit found missing.
      - name: Rules hygiene (enabled ⇒ enforced)
        run: python3 scripts/rules_check.py
      # fw-prov-01 (R11): core.fileMode=false silently drops exec bits; a
      # shebang'd script committed 100644 breaks hosted checkouts.
      - name: Exec-bit integrity (shebang implies 100755 in the index)
        run: python3 scripts/check_exec_bits.py
      # fw-floor-01 (R9): a suite that silently shrinks below its recorded
      # floor FAILS. Floors are data (tests/expected-counts.json).
      - name: Test-count floors
        run: python3 tests/gen_floors.py

  # The repository shipped a secret-scanning template for consumers and did not
  # run one on itself: every push to main passed six jobs and none of them
  # looked for a credential. This is that job (secret-scan-01..06).
  #
  # The scanner is a pinned release binary verified against its published
  # checksum, not a marketplace scanning action: no third-party action to trust,
  # no licence question, and the same mechanism works on a self-hosted runner
  # that already carries the pinned version (the fleet path — design D5/D6).
  secrets:
    name: Secret scan (pinned gitleaks over the pushed range)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The pushed range is resolved locally, and the no-base fall-back
          # walks the whole history; a shallow clone would make both of them
          # scan less than they claim to.
          fetch-depth: 0
      - name: Provide the pinned scanner (checksum-verified when fetched)
        run: |
          set -eu
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if command -v gitleaks >/dev/null 2>&1; then
            echo "using the scanner already on PATH: $(command -v gitleaks)"
            exit 0
          fi
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSL -o gitleaks.tar.gz "${URL}/gitleaks_${VERSION}_linux_x64.tar.gz"
          # Refuse to run an artifact that is not the bytes the pin names. This
          # is what makes the pin a pin rather than a version string in a file.
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: The scanner is the pinned version (an unversioned scanner is not this contract)
        run: |
          set -eu
          VERSION=8.30.1
          got="$(gitleaks version)"
          echo "gitleaks version: $got"
          case "$got" in
            *"$VERSION"*) ;;
            *)
              echo "FAIL: gitleaks reports '$got', not $VERSION."
              echo "A runner that carries the pinned version passes this step"
              echo "without fetching (fleet pre-provisioning); anything else is"
              echo "a different scanner than the gate was specified against."
              exit 1
              ;;
          esac
      - name: Secret scan (the pushed range; the history when there is no base)
        env:
          EV_BEFORE: ${{ github.event.before }}
          EV_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            ARGS=(--range "${PR_BASE}..${PR_HEAD}")
          elif [ -n "${EV_BEFORE:-}" ] && [ -n "${EV_AFTER:-}" ]; then
            ARGS=(--range "${EV_BEFORE}..${EV_AFTER}")
          else
            # workflow_dispatch and anything else with no range in the payload:
            # say so, and sweep rather than scan nothing (secret-scan-04).
            echo "::notice::no range in this event's payload — sweeping the full history"
            ARGS=(--all)
          fi
          rc=0
          out="$(bash scripts/secret-scan.sh --repo "$GITHUB_WORKSPACE" \
                   --report "$RUNNER_TEMP/secret-scan.json" "${ARGS[@]}" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # Non-vacuity: the gate names its scope before it scans. A job that
          # passes because the gate never ran is the exact failure this package
          # exists to close, so assert the run happened, not just the exit code.
          printf '%s\n' "$out" | grep -q '^\[secret-scan\] scope:' || {
            echo "FAIL: the gate never reported a scope — it did not run."
            exit 1
          }
          exit "$rc"
      # The report is built from finding locations only — the gate never copies
      # the scanner's Secret/Match fields — so printing it into the log keeps the
      # evidence without introducing an artifact-upload action (this repo pins
      # every action by SHA, and log retention covers a redacted JSON fine).
      - name: Redacted report (locations only — no matched values)
        if: always()
        run: |
          R="$RUNNER_TEMP/secret-scan.json"
          if [ -f "$R" ]; then
            cat "$R"
          else
            echo "no report at $R — the gate did not reach the point of writing one"
          fi

  specs:
    name: Specs (openspec strict + traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # Hard gate since migrate-specs-to-openspec-conventions: the whole tree
      # (specs + changes) validates strict, and both parsers agree on
      # requirement counts (spec-fmt-01).
      #
      # PINNED ON PURPOSE. This was `@fission-ai/openspec` unpinned, so the gate
      # moved under the tree whenever upstream published: a new rule could turn
      # a green branch red (or, worse, a relaxation could turn a red tree green)
      # with no commit on our side. Bump deliberately, and re-run the negative
      # control below when you do — the pin and the control are a pair.
      - name: Install openspec CLI (pinned)
        run: npm install --no-save --no-audit --no-fund @fission-ai/openspec@1.13.0
      - name: openspec validate (strict, hard gate)
        run: npx openspec validate --all --strict
      # The hard gate above proves the tree is well-formed. It does NOT prove
      # the validator can refuse ill-formed material — if the command were
      # downgraded to a no-op the tree would keep validating green and the gate
      # would be decorative. This feeds a known-broken item to the same command
      # and requires a nonzero exit (spec-fmt-04).
      - name: strict validation refuses malformed material (negative control)
        run: bash scripts/specs-validate-negative-control.sh
      - name: Requirement-ID traceability
        run: |
          # pipefail so a traceability failure is not masked by `tail`: under
          # Actions' default `bash -e` a pipeline's status is the LAST
          # command's (tail exits 0), so a ratchet regression would read green.
          # The shipped template got this fix first (templates/github-workflows/
          # specs.yml); the framework's own CI now carries it too.
          set -o pipefail
          python3 scripts/spec_traceability.py --root . --report | tail -8
          python3 scripts/spec_traceability.py --root . | tail -2

  container-image:
    name: Evaluator image builds with its contracts (coh-rt-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The full real-container smoke (valid-request PASS) requires the image
      # to match the identity registry — that is publish-gated (S4, needs
      # registry credentials) and runs on the fleet; this job proves what can
      # be proven from source: the image builds reproducibly and CARRIES its
      # frozen schemas (F1 regression: it once shipped without them).
      - name: Build pinned image
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "SKIPPED: podman unavailable on this runner — image build not evaluated."
            exit 0
          fi
          podman build --timestamp 0 -t devgate-coherence -f container/Containerfile .
      - name: Schemas resolve inside the image
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "SKIPPED (same reason as above)"
            exit 0
          fi
          podman run --rm --read-only --read-only-tmpfs --cap-drop=ALL \
            --security-opt=no-new-privileges --network=none \
            --entrypoint python3 devgate-coherence -c \
            "from hub.coherence import schemacheck; schemacheck.load('request.schema.json'); schemacheck.load('result.schema.json'); print('schemas OK in image')"
      # The identity record names THE BYTES CONSUMERS PULL, so that is what
      # gets checked — not a local store's digest. Measured 2026-09-23: a
      # locally built image's `podman image inspect {{.Digest}}` is a value no
      # registry ever serves (the push re-encodes the manifest: local
      # 2eff3fd9…, registry manifest f470110c… for the same bytes), so the
      # previous comparison here was config-against-config — it agreed with
      # itself and the S4 pin shipped UNPULLABLE (`manifest unknown` for every
      # consumer, while this job was green). Fetchability is the property the
      # consumer chain depends on, and it is checkable from here. Measured
      # again 2026-09-24: a PULLED image's local `.Digest` is no better an
      # axis than a built one's (run 36052355931), so the pull is the whole
      # check and nothing local is compared to the record.
      - name: Recorded identity resolves to fetchable bytes (hard gate)
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "::error::podman unavailable — the identity registry could not be evaluated"
            exit 1
          fi
          IMAGE="$(python3 -c "import json;print(json.load(open('container/execution-profiles.json'))['image'])")"
          RECORDED="$(python3 -c "import json;print(json.load(open('container/execution-profiles.json'))['profiles'][0]['image_manifest_digest'])")"
          echo "image:    $IMAGE"
          echo "recorded: $RECORDED"
          # Anonymous on purpose: a consumer's runner has no registry
          # credentials either, so an authenticated-only pull must fail here.
          if ! REGISTRY_AUTH_FILE=/nonexistent podman pull --quiet "$IMAGE@$RECORDED"; then
            echo "::error::the identity registry names bytes no registry serves ($IMAGE@$RECORDED) — every consumer gate would SKIP at launch"
            exit 1
          fi
          # The pull above IS the check, and it is a strong one: `podman pull
          # repo@digest` verifies the manifest it fetched against the requested
          # digest, so success means the registry holds bytes addressed by the
          # record.
          #
          # Deliberately NOT compared afterwards: `podman image inspect
          # --format '{{.Digest}}'` of the ref just pulled reads the LOCAL
          # store, and whether that echoes the requested digest is not a
          # property this pipeline owns. Measured 2026-09-24 on run
          # 36052355931 — the pull of a correct record landed (the fetched
          # config digest was the pinned image's) and the comparison still
          # failed the job, the store reporting 6032c209… for bytes the
          # registry addresses as fc7074e7…. Same wrong-axis comparison this
          # job was fixed for once already, then against a built image and now
          # against a pulled one.
          # The fetched bytes must be the evaluator, not merely resolvable: the
          # image carries its frozen contracts (coh-rt-08, F1) — prove it on
          # the digest-pinned ref, under the launcher's enforced flag set.
          podman run --rm --read-only --read-only-tmpfs --cap-drop=ALL \
            --security-opt=no-new-privileges --network=none \
            --entrypoint python3 "$IMAGE@$RECORDED" -c \
            "from hub.coherence import schemacheck; schemacheck.load('request.schema.json'); schemacheck.load('result.schema.json'); print('schemas OK in the fetched image')"

  # fw-* evaluator-integrity: the evaluator itself is attacked on every run.
  # A green suite means nothing if deliberately broken production behavior
  # stays green, if the evaluator accepts forged input, or if identical
  # inputs produce different decisions.
  evaluator-integrity:
    name: The evaluator itself is attacked (fw-*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # mutation_check refuses uncommitted targets; corpus wants real tree
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Mutation tool self-check
        run: python3 scripts/mutation_check.py --self-check
      # The batteries assert the thing the whole ritual rests on: that each
      # guard is killable by exactly one named test, and that a negative control
      # survives. They are not `test_*.py`, so pytest does not collect them, and
      # until self-check-the-mutation-harness no step ran them at all — a
      # survivor was visible only to whoever remembered to run one by hand.
      # They rewrite tracked files in place and restore them in a `finally`,
      # which is why they sit here rather than in the suite job.
      #
      # Named individually, not globbed: `test_every_battery_runs_in_the_suite`
      # reads this list back and fails when a battery exists that is not on it,
      # which is how a fourth one is stopped from being silently unrun.
      - name: mutation batteries (every guard killable by exactly one named test)
        run: |
          for b in tests/mutation_battery_size_scope.py \
                   tests/mutation_battery_image_cycle.py \
                   tests/mutation_battery_image_state.py \
                   tests/mutation_battery_publish_trigger.py \
                   tests/mutation_battery_secret_scan_fleet.py \
                   tests/mutation_battery_runner_sweep.py \
                   tests/mutation_battery_scan_report.py \
                   tests/mutation_battery_scan_view.py \
                   tests/mutation_battery_monitor_default_deny.py \
                   tests/mutation_battery_runbook_claims.py \
                   tests/mutation_battery_zig_comment.py \
                   tests/mutation_battery_compat.py \
                   tests/mutation_battery_oap_acceptance.py; do
            echo "::group::$b"
            python3 "$b" || exit 1
            echo "::endgroup::"
          done
      - name: Mutation strength on evidence module
        run: |
          python3 scripts/mutation_check.py --target hub/coherence/evidence.py \
            --tests "python3 -m pytest tests/test_hub_coherence.py tests/test_hub_coherence_runtime.py tests/test_hub_coherence_conformance.py tests/test_hub_coherence_fw.py -x -q" \
            --timeout 240
      - name: Negative controls (evaluator must reject)
        run: python3 scripts/negative_controls.py
      - name: Benchmark corpus — no-op solver must fail everything
        run: |
          python3 .benchmarks/harness.py --all --solver "true" && {
            echo "no-op solver PASSED a task — hidden verification cannot detect work"
            exit 1
          }
          test $? -eq 1 || { echo "corpus invalid (exit != 1)"; exit 1; }
      - name: Benchmark corpus — golden solutions must pass everything
        run: |
          python3 .benchmarks/harness.py --all \
            --solver "python3 {task_dir}/solution/solve.py {repo_dir}"
      - name: Gaming strategy rejected (multi-solver)
        run: |
          python3 .benchmarks/multi_solver.py --task t02-feature-env-bool \
            --gaming-demo \
            --strategy golden="python3 {task_dir}/solution/solve.py {repo_dir}"
      - name: Determinism drill (byte-identical decisions)
        run: python3 scripts/determinism_drill.py --runs 30
      - name: Regression-corpus staleness audit (advisory)
        run: python3 scripts/regression_corpus.py --stale || true
      # fw-noise-01 (R8): allowlist growth is visible — green-through-
      # suppression trips an advisory, never fails silently.
      - name: Allowlist health (advisory)
        if: github.event_name == 'pull_request'
        run: python3 scripts/allowlist_health.py --target "origin/${{ github.base_ref }}" || test $? -eq 10

  # S4 publish gate: build the pinned image reproducibly and push it to GHCR
  # under the repository's own identity. Uses the workflow's own GITHUB_TOKEN
  # (packages: write) — no personal credentials anywhere.
  #
  # Publishes on EVERY push to main — the owner decided 2026-09-26 that CI
  # publishes without a human dispatching it, and "fully documented" is the
  # contract for that: every merge to main builds the image and pushes it to
  # ghcr, tagged :main and :sha-<12>. Manual dispatch with inputs.publish=true
  # is still available as a deliberate re-publish (Actions → CI → Run workflow
  # → tick "publish") without waiting for a merge.
  #
  # What a merge-to-main publish is NOT: a release. The record in
  # container/execution-profiles.json describes a release, and what moves it
  # is still a deliberate act — the re-pin operation
  # (scripts/re-pin-evaluator-identity.sh), never a push. Hosts converge on
  # the RECORDED digest, never on :main, so an auto-published :main that has
  # not been re-pinned changes nothing in the fleet except the divergence
  # advisory (img-cycle-05) telling the owner a re-pin is due. History: the
  # original design inverted this (img-cycle-06) because every merge
  # publishing was then an undocumented accident; the owner has since made
  # the accidental behavior the policy, with this comment as its document and
  # the divergence advisory as its control.
  #
  # tests/test_publish_trigger.py evaluates this condition against event
  # payloads rather than reading it, so this comment and that `if:` disagreeing
  # is a failing test rather than a sentence nobody re-reads.
  container-publish:
    name: Publish evaluator image to GHCR (S4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # mon-alert-01: the divergence advisory is a GitHub issue on this repo,
      # the same path the fleet's monitor raises (img-cycle-05 says SHALL NOT
      # be reported only as a CI log notice). The notifier is hub/alerts.py.
      issues: write
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build pinned image
        run: |
          podman build --timestamp 0 -t devgate-coherence -f container/Containerfile .
      - name: Schemas resolve inside the image
        run: |
          podman run --rm --read-only --read-only-tmpfs --cap-drop=ALL \
            --security-opt=no-new-privileges --network=none \
            --entrypoint python3 devgate-coherence -c \
            "from hub.coherence import schemacheck; schemacheck.load('request.schema.json'); schemacheck.load('result.schema.json'); print('schemas OK in image')"
      - name: Push to ghcr.io (sha-pinned)
        run: |
          # GHCR requires lowercase repository names; github.repository
          # preserves the owner/repo casing, so normalize here.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/devgate-coherence"
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          for TAG in "$IMAGE:main" "$IMAGE:sha-${GITHUB_SHA::12}"; do
            podman tag devgate-coherence "$TAG"
            podman push "$TAG"
          done
          # Report the digest a CONSUMER resolves, read from the REGISTRY —
          # never from podman's local store. Pushing re-encodes the manifest,
          # and a local `.Digest` is a value no registry serves: measured
          # 2eff3fd9… for a local build, and 6032c209… for an image pulled as
          # fc7074e7… (run 36050827753). Recording a pin from either is how
          # the S4 identity was once recorded unpullable, so ask ghcr what it
          # serves for the tag — the manifest's Docker-Content-Digest.
          # One recipe, one source: the same resolver the cycle and the
          # heartbeat use (scripts/lib/registry-digest.sh). A second curl
          # dance here is the axis-divergence scar — this step's inline copy
          # already disagreed with the re-pin script once.
          . scripts/lib/registry-digest.sh
          # `|| true` so the empty-handling below names the failure rather
          # than the job dying on the resolver's own non-zero (GHA runs bash
          # -eo pipefail).
          SERVED="$(docker_content_digest "$IMAGE" main || true)"
          if [ -z "$SERVED" ]; then
            echo "::error::ghcr reported no digest for $IMAGE:main — this run cannot be recorded as an identity"
            exit 1
          fi
          RECORDED="$(python3 -c "import json;print(json.load(open('container/execution-profiles.json'))['profiles'][0]['image_manifest_digest'])")"
          echo "served digest: $SERVED"
          if [ "$SERVED" != "$RECORDED" ]; then
            DETAIL="served ${IMAGE}:main is ${SERVED} but the record is ${RECORDED} — a re-pin is due"
            echo "::notice::${DETAIL}"
            # img-cycle-05: advisory through mon-alert-01, the same path the
            # fleet watches — NOT only a log notice inside this job. Via `?`
            # rather than a host name: this is a fact about the repository
            # (design D6), and the hub monitor raises the same key from the
            # heartbeat, so the two land on one deduped issue.
            # One -c line: a YAML-indented multi-line -c is an IndentationError.
            ALERT_REPO="${GITHUB_REPOSITORY}" ALERT_DETAIL="${DETAIL}" \
              GITHUB_TOKEN="${GITHUB_TOKEN}" python3 -c 'import os; from hub.alerts import GitHubIssueNotifier; GitHubIssueNotifier(api_base="https://api.github.com", token=os.environ["GITHUB_TOKEN"], alerts_dir=os.environ.get("RUNNER_TEMP", "/tmp")).raise_alert(os.environ["ALERT_REPO"], "image_pin_divergence", "?", os.environ["ALERT_DETAIL"])'
          else
            echo "::notice::published $SERVED — matches the identity registry"
          fi
