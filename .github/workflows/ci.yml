name: CI

# The framework runs its own medicine (fw-ci-01..03): the full test suite,
# the shipped gates against its own tree, and spec validation — on every PR
# and every push to main. Before this workflow existed, nothing executed
# tests/ in CI (QA M9) and a foreign `tests` package could silently drop five
# conformance files from collection without anyone noticing.
#
# Runner targeting: hosted ubuntu-latest (mirrors drift-scan.yml's choice to
# keep the framework's own CI runnable on any fork/PR without fleet access;
# the fleet-labeled runner stays dedicated to consumer drift scans). The
# container-image job degrades to an explicit SKIPPED line when podman is
# unavailable, never a silent pass — that branch is future-proofing only:
# hosted ubuntu-latest ships podman, and the logged runs since 2026-09-22
# execute the build on every push.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite (Python + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: pytest suite (collection is deterministic — tests/__init__.py)
        run: python3 -m pytest tests/ -v
      - name: guardrails scanner fixture suite
        run: node tests/test_guardrails_scan.mjs
      - name: scanner root-anchoring fixture suite
        run: node tests/test_scanner_root_anchor.mjs
      - name: per-file runner (frameworks's own tests through its own runner)
        run: node scripts/run-tests.mjs
      # The runner above exits 0 when it finds nothing, so a broken discovery
      # path would show up as a green step that ran zero tests (the 2026-09-20
      # audit found exactly that: "TOTAL: 0 passed", exit 0). The runner itself
      # now fails closed on zero discovery; this step pins the *outcome* as a
      # number, so a future change that turns discovery back into a no-op has
      # to beat an assertion rather than just print less.
      - name: runner discovered tests (non-vacuity — zero discovery is not a pass)
        run: |
          out="$(node scripts/run-tests.mjs 2>&1)" || { echo "$out"; exit 1; }
          echo "$out" | tail -3
          n="$(printf '%s\n' "$out" | sed -n 's/.*across \([0-9]\+\) files.*/\1/p' | tail -1)"
          if [ -z "$n" ] || [ "$n" -lt 1 ]; then
            echo "FAIL: the runner reported no discovered files — a green test lane that ran nothing."
            exit 1
          fi
          echo "runner discovered $n test file(s)"

  self-gates:
    name: DevGate gates on DevGate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # --base origin/main needs the merge base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Pattern scan (own tree must be warning-clean)
        run: node scripts/guardrails-scan.mjs
      - name: Semantic scan (installs the pinned parser)
        run: |
          npm install --no-save --no-audit --no-fund typescript@5
          node scripts/semantic-scan.mjs
      - name: Regression check (pushed/PR range; zero-input fails)
        run: |
          # PR: merge base against the target branch. Push: the range the
          # push actually added (event.before..HEAD) — using origin/main on a
          # push would diff main against itself, evaluate zero files, and
          # fail this job for the wrong reason.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python3 scripts/regression_check.py --base "$BASE" --fail-if-empty --pre-commit
      - name: Silent-success scan
        run: bash scripts/silent-success-scan.sh
      - name: Failure-registry hygiene
        run: python3 scripts/failure_registry_check.py
      # fw-prov-01 (R11): core.fileMode=false silently drops exec bits; a
      # shebang'd script committed 100644 breaks hosted checkouts.
      - name: Exec-bit integrity (shebang implies 100755 in the index)
        run: python3 scripts/check_exec_bits.py
      # fw-floor-01 (R9): a suite that silently shrinks below its recorded
      # floor FAILS. Floors are data (tests/expected-counts.json).
      - name: Test-count floors
        run: python3 tests/gen_floors.py

  specs:
    name: Specs (openspec strict + traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # Hard gate since migrate-specs-to-openspec-conventions: the whole tree
      # (specs + changes) validates strict, and both parsers agree on
      # requirement counts (spec-fmt-01).
      #
      # PINNED ON PURPOSE. This was `@fission-ai/openspec` unpinned, so the gate
      # moved under the tree whenever upstream published: a new rule could turn
      # a green branch red (or, worse, a relaxation could turn a red tree green)
      # with no commit on our side. Bump deliberately, and re-run the negative
      # control below when you do — the pin and the control are a pair.
      - name: Install openspec CLI (pinned)
        run: npm install --no-save --no-audit --no-fund @fission-ai/openspec@1.13.0
      - name: openspec validate (strict, hard gate)
        run: npx openspec validate --all --strict
      # The hard gate above proves the tree is well-formed. It does NOT prove
      # the validator can refuse ill-formed material — if the command were
      # downgraded to a no-op the tree would keep validating green and the gate
      # would be decorative. This feeds a known-broken item to the same command
      # and requires a nonzero exit (spec-fmt-04).
      - name: strict validation refuses malformed material (negative control)
        run: bash scripts/specs-validate-negative-control.sh
      - name: Requirement-ID traceability
        run: |
          python3 scripts/spec_traceability.py --root . --report | tail -8
          python3 scripts/spec_traceability.py --root . | tail -2

  container-image:
    name: Evaluator image builds with its contracts (coh-rt-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The full real-container smoke (valid-request PASS) requires the image
      # to match the identity registry — that is publish-gated (S4, needs
      # registry credentials) and runs on the fleet; this job proves what can
      # be proven from source: the image builds reproducibly and CARRIES its
      # frozen schemas (F1 regression: it once shipped without them).
      - name: Build pinned image
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "SKIPPED: podman unavailable on this runner — image build not evaluated."
            exit 0
          fi
          podman build --timestamp 0 -t devgate-coherence -f container/Containerfile .
      - name: Schemas resolve inside the image
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "SKIPPED (same reason as above)"
            exit 0
          fi
          podman run --rm --read-only --read-only-tmpfs --cap-drop=ALL \
            --security-opt=no-new-privileges --network=none \
            --entrypoint python3 devgate-coherence -c \
            "from hub.coherence import schemacheck; schemacheck.load('request.schema.json'); schemacheck.load('result.schema.json'); print('schemas OK in image')"
      - name: Built digest vs identity registry (informational)
        run: |
          if ! command -v podman >/dev/null 2>&1; then exit 0; fi
          BUILT="$(podman image inspect --format '{{.Digest}}' devgate-coherence)"
          RECORDED="$(python3 -c "import json;print(json.load(open('container/execution-profiles.json'))['profiles'][0]['image_manifest_digest'])")"
          echo "built:    $BUILT"
          echo "recorded: $RECORDED"
          if [ "$BUILT" != "$RECORDED" ]; then
            echo "::notice::built image digest differs from the identity record — expected until the publish-gated rebuild (S4) updates execution-profiles.json"
          fi

  # fw-* evaluator-integrity: the evaluator itself is attacked on every run.
  # A green suite means nothing if deliberately broken production behavior
  # stays green, if the evaluator accepts forged input, or if identical
  # inputs produce different decisions.
  evaluator-integrity:
    name: The evaluator itself is attacked (fw-*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # mutation_check refuses uncommitted targets; corpus wants real tree
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Mutation tool self-check
        run: python3 scripts/mutation_check.py --self-check
      - name: Mutation strength on evidence module
        run: |
          python3 scripts/mutation_check.py --target hub/coherence/evidence.py \
            --tests "python3 -m pytest tests/test_hub_coherence.py tests/test_hub_coherence_runtime.py tests/test_hub_coherence_conformance.py tests/test_hub_coherence_fw.py -x -q" \
            --timeout 240
      - name: Negative controls (evaluator must reject)
        run: python3 scripts/negative_controls.py
      - name: Benchmark corpus — no-op solver must fail everything
        run: |
          python3 .benchmarks/harness.py --all --solver "true" && {
            echo "no-op solver PASSED a task — hidden verification cannot detect work"
            exit 1
          }
          test $? -eq 1 || { echo "corpus invalid (exit != 1)"; exit 1; }
      - name: Benchmark corpus — golden solutions must pass everything
        run: |
          python3 .benchmarks/harness.py --all \
            --solver "python3 {task_dir}/solution/solve.py {repo_dir}"
      - name: Gaming strategy rejected (multi-solver)
        run: |
          python3 .benchmarks/multi_solver.py --task t02-feature-env-bool \
            --gaming-demo \
            --strategy golden="python3 {task_dir}/solution/solve.py {repo_dir}"
      - name: Determinism drill (byte-identical decisions)
        run: python3 scripts/determinism_drill.py --runs 30
      - name: Regression-corpus staleness audit (advisory)
        run: python3 scripts/regression_corpus.py --stale || true
      # fw-noise-01 (R8): allowlist growth is visible — green-through-
      # suppression trips an advisory, never fails silently.
      - name: Allowlist health (advisory)
        if: github.event_name == 'pull_request'
        run: python3 scripts/allowlist_health.py --target "origin/${{ github.base_ref }}" || test $? -eq 10

  # S4 publish gate: build the pinned image reproducibly and push it to GHCR
  # under the repository's own identity. Uses the workflow's own GITHUB_TOKEN
  # (packages: write) — no personal credentials anywhere. Publishes ONLY on
  # main pushes and manual dispatch with publish=true.
  container-publish:
    name: Publish evaluator image to GHCR (S4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build pinned image
        run: |
          podman build --timestamp 0 -t devgate-coherence -f container/Containerfile .
      - name: Schemas resolve inside the image
        run: |
          podman run --rm --read-only --read-only-tmpfs --cap-drop=ALL \
            --security-opt=no-new-privileges --network=none \
            --entrypoint python3 devgate-coherence -c \
            "from hub.coherence import schemacheck; schemacheck.load('request.schema.json'); schemacheck.load('result.schema.json'); print('schemas OK in image')"
      - name: Push to ghcr.io (sha-pinned)
        run: |
          DIGEST="$(podman image inspect --format '{{.Digest}}' devgate-coherence)"
          echo "built digest: $DIGEST"
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          for TAG in "ghcr.io/${{ github.repository }}/devgate-coherence:main" \
                     "ghcr.io/${{ github.repository }}/devgate-coherence:sha-${GITHUB_SHA::12}"; do
            podman tag devgate-coherence "$TAG"
            podman push "$TAG"
          done
          echo "::notice::published devgate-coherence $DIGEST — update container/execution-profiles.json (S4 acceptance) if this is the release build"
