# Dead-man switch: the monitor's monitor (mon-hub-01, D6).
#
# If this workflow does NOT run within 24h of the last successful run,
# a GitHub issue is opened on this repo. This catches hub-side failures
# that the hub itself cannot detect (e.g., the container is down, the
# poll loop crashed, the token expired).
#
# The job always succeeds when it runs — its mere execution IS the proof
# of life. The dead-man switch fires on ABSENCE, not on failure.

name: devgate-monitor-deadman

on:
  schedule:
    # Runs every 6 hours (GitHub Actions cron is UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  proof-of-life:
    runs-on: ubuntu-latest
    steps:
      - name: Proof of life
        run: |
          echo "devgate-monitor dead-man switch fired at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "If you are reading this in an issue, the schedule stopped firing."
