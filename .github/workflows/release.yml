# Create the GitHub Release from an annotated version tag. This workflow is
# idempotent: scripts/deploy.sh may already have created the release. An
# existing release is evidence; a create failure with no release is fatal.
name: Release Published

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the tagged release
    runs-on: devgate
    steps:
      - name: Checkout the tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0

      - name: Publish and verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # actions/checkout can leave a local tag ref that resolves straight
          # to a commit even when the pushed ref is annotated. Fetch the tag
          # object itself before asserting annotation; do not weaken the check.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semantic version tag"
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is not annotated"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$TAG^{commit}")" ]; then
            echo "::error::checkout HEAD and $TAG resolve to different commits"
            exit 1
          fi
          if [ -f VERSION ] && [ "$(tr -d '[:space:]' < VERSION)" != "${TAG#v}" ]; then
            echo "::error::VERSION disagrees with $TAG"
            exit 1
          fi

          python3 - "$TAG" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import pathlib, sys
          tag, output = sys.argv[1:]
          version = tag[1:]
          heading = f"## [{version}]"
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          notes, found = [], False
          for line in lines:
              if line.strip() == heading or line.strip().startswith(heading + " - "):
                  if found:
                      raise SystemExit(f"duplicate release heading: {heading}")
                  found = True
                  continue
              if found and line.startswith("## ["):
                  break
              if found:
                  notes.append(line)
          body = "\n".join(notes).strip()
          if not found:
              raise SystemExit(f"CHANGELOG.md has no {heading} section")
          if not body:
              raise SystemExit(f"{heading} has no release notes; an empty release is not evidence")
          pathlib.Path(output).write_text(body + "\n", encoding="utf-8")
          print(f"release notes: {len(body.splitlines())} line(s) from {heading}")
          PY

          # Talk to the REST API with curl, not the `gh` CLI. `gh` is NOT
          # guaranteed on a self-hosted runner: the lane images ship the
          # actions/runner toolchain and nothing else, so `gh` exists only where
          # someone installed it into a running container by hand. v1.3.20's
          # release job died here with `gh: command not found` (exit 127) on a
          # spare of the same lane that had passed for v1.3.19 on the base
          # runner, which had a hand-installed copy. A required publish step
          # must not depend on that.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")
          status=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" \
            "$api/releases/tags/$TAG")
          case "$status" in
            200)
              echo "$TAG already has a GitHub Release; leaving its notes editable by maintainers"
              ;;
            404)
              curl -sS -X POST "${auth[@]}" \
                -H "Content-Type: application/json" "$api/releases" \
                --data-binary "$(python3 - "$TAG" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import json, pathlib, sys
          tag, notes = sys.argv[1:]
          print(json.dumps({
              "tag_name": tag,
              "name": tag,
              "body": pathlib.Path(notes).read_text(encoding="utf-8"),
              "draft": False,
              "prerelease": False,
          }))
          PY
          )" >/dev/null || true
              ;;
            *)
              echo "::error::could not read releases for $TAG (HTTP $status)"
              exit 1
              ;;
          esac

          # Verify by reading it back: the release exists, is published (not a
          # draft) and carries the changelog body. An empty release is not
          # evidence.
          curl -sS "${auth[@]}" "$api/releases/tags/$TAG" -o "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$TAG" <<'PY'
          import json, pathlib, sys
          path, tag = sys.argv[1:]
          release = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          if release.get("tag_name") != tag:
              raise SystemExit(f"release tag mismatch: {release.get('tag_name')} != {tag}")
          if release.get("draft"):
              raise SystemExit(f"{tag} exists but is still a draft")
          body = (release.get("body") or "").strip()
          if not body:
              raise SystemExit(f"{tag} has an empty release body")
          print(f"GitHub Release {tag} verified: {release['html_url']} ({len(body.splitlines())} line(s))")
          PY
