# spec-fleet.yml — nightly spec-spacing intake walk (SGA-10..14)
#
# Sibling of secret-fleet.yml (different scan, different failure semantics,
# different reviewer reflex — SGA-10 is explicit that they are NOT merged).
# Walks the SAME declaration files (fleet-sweep-include.txt / -exclude.txt +
# generated owner-scope list), runs the gap scanner per repository, classifies
# each into spaced / gaps / invalid / unspaced / unscannable, commits a capped
# trend report to docs/qa/spec-sweeps/, and alerts via hub_alert.py --key
# spec_fleet_sweep (deduped, repos named in body — SGA-12/13).
#
# Schedule: '47 4' to stagger clone load against secret-fleet's '17 4'.
name: Spec Fleet Sweep

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    name: Spec fleet sweep
    runs-on: devgate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The devgate runner image ships a node20 whose own npm is broken
      # (`Cannot find module '../lib/cli.js'` from bin/npm) — measured on the
      # first dispatch of this workflow, 2026-10-24. setup-node installs a
      # clean tool-cache node+npm, which is why ci.yml can run npm at all.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Without the validator every openspec-material repo classifies
      # `unscannable`, which the red step treats as a census failure — so a
      # runner with no tooling would alert every night about its own missing
      # dependency. Pinned to the same version the lock and templates/specs.yml
      # use, and handed to the classifier explicitly (SPEC_AUDIT_OPENSPEC_BIN)
      # rather than relying on PATH.
      - name: Install the pinned openspec CLI
        env:
          OPENSPEC_PACKAGE: "@fission-ai/openspec@1.13.0"
        run: npm install --no-save --no-audit --no-fund "$OPENSPEC_PACKAGE"

      - name: Generate the declaration (reuse secret-scan-declared.sh)
        id: generate
        env:
          # The generator runs `gh repo list` for owner-scope discovery
          # (SGA-10: a new repo is noticed the night it appears). Without the
          # token it exits 2 — measured on dispatch 40062752087.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          bash scripts/secret-scan-declared.sh --out "$RUNNER_TEMP/declared.raw.txt"
          # The walk clones unauthenticated, so a private repo can only ever
          # read `unscannable` — and unscannable is a RED (SGA-12). Measured
          # 2026-10-24: four private repos in the shared declaration red every
          # night forever, which is the SGR-10 muted-gate failure. They are
          # dropped HERE and named HERE, never silently; an authenticated
          # clone would need a token-plumbing design of its own (a token in
          # git's argv would land in the report and the public issue).
          python3 - "$RUNNER_TEMP/declared.raw.txt" "$RUNNER_TEMP/declared.txt" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          raw, out = Path(sys.argv[1]), Path(sys.argv[2])
          lines = raw.read_text(encoding="utf-8").splitlines()
          def visibility(full):
              """True if GitHub says the repo is private, False if public, None
              if it cannot be read (404/401 — indistinguishable from deleted)."""
              try:
                  res = subprocess.run(
                      ["gh", "api", f"repos/{full}", "--jq", ".private"],
                      capture_output=True, text=True, timeout=60)
              except Exception:  # noqa: BLE001
                  return None
              if res.returncode != 0:
                  return None
              return (res.stdout or "").strip() == "true"
          seen_full = []
          for line in lines:
              m = re.match(r"https://github\.com/([^/]+)/([^/]+?)/?$", line.strip())
              if m and f"{m.group(1)}/{m.group(2)}" not in seen_full:
                  seen_full.append(f"{m.group(1)}/{m.group(2)}")
          private = {full for full in seen_full if visibility(full) is True}
          # A repo the API cannot read at all is NOT dropped: 404/401 is
          # exactly how a deleted repo answers too, and SGA-12 requires that
          # one to red and name itself. Only a repo GitHub positively reports
          # as private is dropped — the unauthenticated clone can never read
          # it, so it would red every night forever.
          kept, dropped, seen = [], set(), set()
          for line in lines:
              m = re.match(r"https://github\.com/([^/]+)/([^/]+?)/?$", line.strip())
              full = f"{m.group(1)}/{m.group(2)}" if m else None
              if full and full in private:
                  dropped.add(full)
                  continue
              # the generator can list the same repo twice (two discovery
              # paths); a duplicate scan double-counts the trend line.
              if line.strip() in seen:
                  continue
              seen.add(line.strip())
              kept.append(line)
          out.write_text("\n".join(kept) + ("\n" if kept else ""), encoding="utf-8")
          print(f"[declaration] dropped {len(dropped)} private repo(s), unreadable unauthenticated: {sorted(dropped)}")
          PY
          echo "count=$(wc -l < "$RUNNER_TEMP/declared.txt")" >> "$GITHUB_OUTPUT"

      - name: Run the walk
        id: walk
        env:
          DECLARED: ${{ runner.temp }}/declared.txt
          TIER: spec-audit-tier.txt
          LOCK: spec-templates.lock.json
          SPEC_AUDIT_OPENSPEC_BIN: ${{ github.workspace }}/node_modules/.bin/openspec
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/spec-work"
          bash scripts/spec-fleet-walk.sh \
            --declared "$DECLARED" \
            --report "$RUNNER_TEMP/spec-report.json" \
            --work "$RUNNER_TEMP/spec-work" \
            --tier-file "$TIER" \
            --lock-file "$LOCK"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "[walk] exit $rc"
          exit 0

      - name: Redacted report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec-fleet-report
          path: ${{ runner.temp }}/spec-report.json
          retention-days: 90

      - name: Commit the report (trend line in git)
        if: always()
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/spec-report.json" ] || { echo "no report"; exit 0; }
          python3 - "$RUNNER_TEMP/spec-report.json" "$RUNNER_TEMP/committed-spec-report.json" <<'TRIM'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          CAP = 50
          for r in doc.get("repos", []):
              # trim per-repo reasons already capped at 100 chars; keep full
              pass
          json.dump(doc, open(sys.argv[2], "w", encoding="utf-8"),
                    indent=2, sort_keys=True)
          TRIM
          mkdir -p docs/qa/spec-sweeps
          DATE="$(date -u +%F)"
          cp "$RUNNER_TEMP/committed-spec-report.json" "docs/qa/spec-sweeps/${DATE}.json"
          git config user.name "devgate-spec-sweep[bot]"
          git config user.email "devgate-spec-sweep[bot]@users.noreply.github.com"
          git add docs/qa/spec-sweeps/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "spec sweep ${DATE} (automated)"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      # SGA-21 / SGR-11: template-drift findings are routed to their own
      # deduped issue REGARDLESS of the sweep's red/green verdict. A red
      # night (an unscannable repo, say) must not silently swallow the drift
      # findings — the two channels are independent by design: spec_fleet_sweep
      # is the nightly verdict, spec_template_drift is the drift issue.
      - name: Route template-drift findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/spec-report.json
        run: |
          set -eu
          if [ ! -f "$REPORT" ]; then
            echo "no report — no drift findings to route"
            exit 0
          fi
          python3 - "$REPORT" <<'PY'
          import json, subprocess, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          findings = []
          lp = doc.get("lock_provenance", {}) or {}
          if lp.get("drift"):
              findings.append("lock: " + ", ".join(
                  d["template"] for d in lp["drift"]))
          for r in doc.get("repos", []):
              prov = r.get("provenance", {}) or {}
              if prov.get("drift") or prov.get("unlocked"):
                  findings.append(r.get("name"))
          if not findings:
              print("no template-drift findings")
              raise SystemExit(0)
          print("PROVENANCE FINDINGS (deduped drift issue, not red):", findings)
          res = subprocess.run(
              [sys.executable, "scripts/hub_alert.py",
               "--key", "spec_template_drift", "--report", sys.argv[1]],
              capture_output=True, text=True)
          if res.returncode != 0:
              # A finding is not a red, and neither is an alert that could
              # not be raised — but it must not be silent.
              print("drift issue could not be raised:",
                    (res.stderr or res.stdout or "no output")[:300],
                    file=sys.stderr)
          else:
              print("drift issue raised or deduped (key spec_template_drift)")
          PY

      - name: Fail loudly and route
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/spec-report.json
        run: |
          set -eu
          if [ ! -f "$REPORT" ]; then
            python3 scripts/hub_alert.py --key spec_fleet_sweep \
              --detail "spec-fleet walk produced no report: nothing was measured" || true
            exit 1
          fi
          rc=0
          python3 - "$REPORT" <<'PY' || rc=$?
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          states = doc.get("states", {})
          repos = doc.get("repos", [])
          # SGA-11: unspaced never red.
          # invalid reds only for tiered repos.
          red_invalid = [r for r in repos
                         if r.get("state") == "invalid" and r.get("tiered")]
          unscannable = [r for r in repos if r.get("state") == "unscannable"]
          if red_invalid or unscannable:
              # build a detail naming repos
              names = [r.get("name") for r in (red_invalid + unscannable)]
              print("RED:", names)
              sys.exit(1)
          print("spec fleet: green (unspaced is informational)")
          PY
          # `set -eu` would abort at the failing heredoc above before `rc` was
          # read, so the alert on the next line never ran. Measured 2026-10-24
          # on run 40062808349: the step reded naming five unscannable repos
          # and issue #35 received no comment at all. The `|| rc=$?` above is
          # what keeps the alert reachable.
          if [ "$rc" -ne 0 ]; then
            python3 scripts/hub_alert.py --key spec_fleet_sweep --report "$REPORT" || true
            exit 1
          fi
          # Provenance (SGA-20..22): a FAULT -- unreadable lock, a pin that no
          # longer matches its own pin_source, or an unreachable upstream --
          # reds. Drift and unlocked copies are findings routed to the deduped
          # drift issue (SGA-21 / SGR-11), not a nightly red: upstream moves
          # whenever Fission-AI edits a template, and reding that every time
          # is the SGR-10 muted-gate failure this package exists to avoid.
          rc=0
          python3 - "$REPORT" <<'PY' || rc=$?
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          faults, findings = [], []
          # Lock-level: pin integrity + upstream drift, once per sweep.
          lp = doc.get("lock_provenance", {}) or {}
          if lp.get("fault") or (lp.get("unknown") or []):
              faults.append("lock: " + (lp.get("reason") or "fault"))
          if lp.get("drift"):
              findings.append("lock: " + ", ".join(
                  d["template"] for d in lp["drift"]))
          # Per-tree: local drift and unlocked copies.
          for r in doc.get("repos", []):
              prov = r.get("provenance", {}) or {}
              name = r.get("name")
              if prov.get("fault") or (prov.get("unknown") or []):
                  faults.append(name)
              if prov.get("drift") or prov.get("unlocked"):
                  findings.append(name)
          if findings:
              print("PROVENANCE FINDINGS (routed by the drift step above):",
                    findings)
          if faults:
              print("PROVENANCE FAULT RED:", faults)
              sys.exit(1)
          print("provenance: no fault")
          PY
          if [ "$rc" -ne 0 ]; then
            python3 scripts/hub_alert.py --key spec_fleet_sweep --report "$REPORT" || true
            exit 1
          fi
