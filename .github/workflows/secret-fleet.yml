# secret-fleet.yml — the nightly full-fleet sweep.
#
# One job, all repos the owner-scope token can see, full history, redacted
# report. The report is uploaded as an artifact AND committed to
# docs/qa/fleet-sweeps/<date>.json so the trend line lives in git and is
# diffable without GitHub.
#
# Action pin SHA is filled from the action's release at adoption and
# recorded in docs/qa/<date>-fleet-sweep-live.md. The family the reference
# sketch annotated (`# v2` / `# v4` / `# v5`) is the family this workflow
# pins to — do not silently cross to a newer major because its tag moved.
#
# The RUNNER label is `devgate`, matching drift-scan.yml in this repo.
# SGR-12 allows a documented `ubuntu-latest` fallback; the fallback is a
# single labels edit in this file, and the empty-PATH diagnostic in the
# generator proves the suite runs on a bare PATH so the fallback is real.
#
# The App-token step is skipped when Sprint 0.1 has not been done
# (`vars.DEVGATE_SWEEP_APP_ID` unset). The workflow still runs, uses the
# default `github.token`, and the count-parity step Fails Loudly naming the
# delta: without an owner-scope token the declaration cannot grow past the
# single repo this workflow runs in, which IS the residual finding this
# design was built to surface. Do not paper over it.
name: Secret Fleet Sweep

on:
  schedule:
    - cron: '17 4 * * *'   # nightly; platform owns the clock (A2)
  workflow_dispatch: {}

permissions:
  contents: write   # enough to commit the report to docs/qa/fleet-sweeps/
  issues: write     # the deduped GitHub issue, re-used across runs

jobs:
  sweep:
    name: Fleet sweep (all repos, full history, redacted)
    runs-on: devgate   # D5/SGR-12 self-hosted; ubuntu-latest is the documented fallback
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Mint the sweep token (GitHub App, installation-scoped)
        id: app-token
        if: ${{ vars.DEVGATE_SWEEP_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DEVGATE_SWEEP_APP_ID }}
          private-key: ${{ secrets.DEVGATE_SWEEP_APP_PRIVATE_KEY }}
          owner: TheArchitectit

      - name: Credentialed clone path (token never leaves the runner)
        id: sweep-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_TOKEN: ${{ github.token }}
          APP_ID_SET: ${{ vars.DEVGATE_SWEEP_APP_ID }}
        run: |
          set -eu
          if [ -n "$APP_TOKEN" ]; then
            TOKEN="$APP_TOKEN"
            MODE=app
            echo "sweep token: DevGate sweep App (owner-scoped)"
          else
            TOKEN="$DEFAULT_TOKEN"
            MODE=default-only
            echo "Sprint 0.1 is not done (vars.DEVGATE_SWEEP_APP_ID unset)."
            echo "Falling back to the repository-scoped default token."
            echo "The declaration will shrink to this repo and the count-parity"
            echo "step below will fail naming the delta. That is the designed"
            echo "output; the fix is Sprint 0.1, not a wider default token."
          fi
          [ -n "$TOKEN" ] || { echo "no token resolvable"; exit 1; }
          echo "::add-mask::$TOKEN"
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$TOKEN" > "$HOME/.git-credentials"
          chmod 0600 "$HOME/.git-credentials"
          echo "token_mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Provide the pinned scanner
        run: |
          set -eu
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if command -v gitleaks >/dev/null 2>&1; then
            echo "using the scanner already on PATH"
            exit 0
          fi
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSL -o gitleaks.tar.gz "${URL}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks

      - name: The scanner is the pinned version
        run: |
          set -eu
          got="$(gitleaks version)"
          echo "gitleaks version: $got"
          case "$got" in *8.30.1*) ;; *) echo "FAIL: $got is not the pin"; exit 1 ;; esac

      - name: Generate the declaration (never hand-maintained)
        id: generate
        env:
          GH_TOKEN: ${{ steps.sweep-token.outputs.token_mode == 'app' && steps.app-token.outputs.token || github.token }}
        run: |
          set -eu
          bash scripts/secret-scan-declared.sh --out "$RUNNER_TEMP/declared.txt"
          wc -l "$RUNNER_TEMP/declared.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/declared.txt")" >> "$GITHUB_OUTPUT"

      - name: Count parity (the declaration cannot silently shrink)
        env:
          GH_TOKEN: ${{ steps.sweep-token.outputs.token_mode == 'app' && steps.app-token.outputs.token || github.token }}
          DECLARED: ${{ runner.temp }}/declared.txt
        run: |
          set -eu
          # T-11. The check is intentionally independent of the generator's
          # merge so a silent drop in either is visible. It computes:
          #   expected = (live non-archived in $OWNER)
          #              - (any of those that match an exclude entry)
          #              + (include URLs not already covered and not excluded)
          # and fails naming the delta if the declaration count differs.
          python3 - "$DECLARED" <<'PY'
          import json, os, subprocess, sys, tempfile
          from urllib.parse import urlparse

          decl_path, = sys.argv[1:2]
          ROOT = "."
          def _read(p):
              try:
                  return open(p, encoding="utf-8").read()
              except OSError:
                  return ""

          def _tokens(path):
              toks = []
              for raw in _read(path).splitlines():
                  line = raw.strip()
                  if not line: continue
                  code, _, _comment = line.partition("#")
                  code = code.strip()
                  if not code or code.startswith("-"): continue
                  toks.append(code)
              return toks

          def _norm(u):
              u = (u or "").strip()
              if u.endswith(".git"): u = u[:-4]
              return u.rstrip("/")

          def _owner_name(u):
              if "://" not in u: u = "https://github.com/" + u
              parts = [p for p in urlparse(u).path.strip("/").split("/") if p]
              if len(parts) >= 2: return f"{parts[-2]}/{parts[-1]}"
              return parts[-1] if parts else u

          def _name_only(u): return _owner_name(u).split("/")[-1]

          def _excluded(url, toks):
              u_key, o_key, n_key = _norm(url).lower(), _owner_name(url).lower(), _name_only(url).lower()
              for tok in toks:
                  t = _norm(tok).lower()
                  if t == u_key: return True
                  if "/" in t:
                      if t == o_key: return True
                  elif t == n_key: return True
              return False

          include = _tokens("fleet-sweep-include.txt")
          exclude = _tokens("fleet-sweep-exclude.txt")

          gh_env = dict(os.environ)
          if not gh_env.get("GH_TOKEN") and gh_env.get("GITHUB_TOKEN"):
              gh_env["GH_TOKEN"] = gh_env["GITHUB_TOKEN"]
          # Owner-scope listing is the ONLY way this check is meaningful. A
          # repo-scoped token returns a single item and the right answer is to
          # fail naming the delta, not to widen the default.
          listing = subprocess.run(
              ["gh", "repo", "list", "TheArchitectit", "--limit", "1000",
               "--json", "nameWithOwner,isPrivate,isArchived,url"],
              capture_output=True, text=True, env=gh_env,
          )
          if listing.returncode != 0:
              print("[count-parity] gh repo list failed:", listing.stderr, file=sys.stderr)
              print("[count-parity] this is red: without a listing there is no live count to compare",
                    file=sys.stderr)
              sys.exit(1)

          live = json.loads(listing.stdout)
          if not isinstance(live, list):
              print("[count-parity] gh repo list is not a JSON array", file=sys.stderr); sys.exit(1)

          live_urls = []
          for r in live:
              if not isinstance(r, dict) or r.get("isArchived"): continue
              u = _norm(r.get("url", ""))
              if u: live_urls.append(u)

          from_live_not_excluded = [u for u in live_urls if not _excluded(u, exclude)]

          from_include_not_already = []
          seen_lower = {u.lower() for u in from_live_not_excluded}
          for t in include:
              u = _norm(t)
              if not u or _excluded(u, exclude): continue
              if u.lower() in seen_lower: continue
              from_include_not_already.append(u)
              seen_lower.add(u.lower())

          expected = len(from_live_not_excluded) + len(from_include_not_already)
          actual = 0
          with open(decl_path, encoding="utf-8") as fh:
              actual = sum(1 for line in fh if line.strip())

          print(f"[count-parity] live={len(live_urls)} "
                f"live_not_excluded={len(from_live_not_excluded)} "
                f"include_added={len(from_include_not_already)} "
                f"expected={expected} declared={actual}")
          if actual != expected:
              print(f"[count-parity] DECLARATION COUNT MISMATCH: declared={actual} expected={expected} "
                    f"delta={actual - expected:+d}", file=sys.stderr)
              print("[count-parity] the declaration has silently shrunk (or grown). "
                    "Either the generator, the owner token, or an include/exclude file "
                    "has changed. Do not push until the delta is explained.", file=sys.stderr)
              sys.exit(1)
          print("[count-parity] OK")
          PY

      - name: Run the sweep
        id: sweep
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/fleet-work"
          bash scripts/secret-scan-fleet.sh \
            --declared "$RUNNER_TEMP/declared.txt" \
            --report "$RUNNER_TEMP/fleet-report.json" \
            --work "$RUNNER_TEMP/fleet-work"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "[sweep] exit $rc"
          exit 0   # the report steps must run; the fail step below decides

      - name: Drift + advisory + protection sections (SGR-06/16/17)
        id: drift
        if: always()
        env:
          # Protection readback calls gh api against OTHER repos; the
          # repo-scoped default token would answer 'unknown' for every one of
          # them and the section would read as noise. Same App-token fallback
          # shape as the generate/parity steps.
          GH_TOKEN: ${{ steps.sweep-token.outputs.token_mode == 'app' && steps.app-token.outputs.token || github.token }}
          WORK: ${{ runner.temp }}/fleet-work
          REPORT: ${{ runner.temp }}/fleet-report.json
        run: |
          set -eu
          # Fills the report's extension fields, then rewrites it in place.
          #   drift[]        vendored scripts/secret-scan.sh sha256 != the canonical
          #   advisory[]     an unexpectedly-present continue-on-error:true in a workflow
          #   protection{}   branch-protection readback per repo (unknown if unreachable)
          # SGR-17: an unprotected repo is NOT a failure (protection is policy).
          # SGR-06/16: any drift or advisory entry IS a failure and the Fail step below
          # will see it as part of the exit code.
          python3 - "$WORK" "$REPORT" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path

          work_dir = Path(sys.argv[1])
          report_path = Path(sys.argv[2])

          # The canonical vendored gate is THIS repo's scripts/secret-scan.sh.
          # Any consumer whose byte-wise sha256 differs is drifting a local
          # scanner and deserves to be named (openagentplatform's drift is the
          # reason this section exists).
          canonical_path = Path("scripts/secret-scan.sh")
          if not canonical_path.exists():
              print(f"[drift] cannot find canonical {canonical_path} - refusing to compute drift",
                    file=sys.stderr)
              sys.exit(1)
          canonical = hashlib.sha256(canonical_path.read_bytes()).hexdigest()

          def _sha256(p: Path):
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None

          drift = []
          advisory = []
          protection = {}

          if work_dir.is_dir():
              for sub in sorted(work_dir.iterdir()):
                  if not sub.is_dir(): continue
                  # Secret-scan-fleet clones each URL into $WORK/<IDX>-<name>.
                  name = sub.name.split("-", 1)[-1]
                  gate = sub / "scripts" / "secret-scan.sh"
                  got = _sha256(gate)
                  if got is None:
                      drift.append({"repo": name, "gate_sha256": None,
                                    "expected": canonical,
                                    "note": "no vendored scripts/secret-scan.sh"})
                  elif got != canonical:
                      drift.append({"repo": name, "gate_sha256": got,
                                    "expected": canonical,
                                    "note": "vendored gate hash diverges from the canonical copy"})
                  # SGR-16: no new advisory gates. Any `continue-on-error: true`
                  # in a shipped workflow is named.
                  wdir = sub / ".github" / "workflows"
                  if wdir.is_dir():
                      for wf in sorted(wdir.glob("*.yml")) + sorted(wdir.glob("*.yaml")):
                          try: text = wf.read_text(encoding="utf-8", errors="replace")
                          except OSError: continue
                          for lineno, line in enumerate(text.splitlines(), 1):
                              if "continue-on-error" in line and "true" in line.split("continue-on-error", 1)[1][:20]:
                                  advisory.append({
                                      "repo": name,
                                      "file": str(wf.relative_to(sub)),
                                      "line": lineno,
                                      "note": "advisory gate - SGR-16 forbids new ones; this one is named for triage",
                                  })
                  # SGR-17: branch-protection readback. Bounded wealth: if the
                  # API call cannot be made (private, missing scope, rate limit),
                  # record `unknown` rather than `unprotected` — `unknown` never
                  # reads as unprotected (SGR-17 / OQ3).
                  api = f"https://api.github.com/repos/TheArchitectit/{name}/branches/main/protection"
                  try:
                      out = subprocess.run(
                          ["gh", "api", api,
                           "--jq", '(.required_status_checks.contexts // []) | join(",")'],
                          capture_output=True, text=True, timeout=15,
                      )
                      if out.returncode == 0:
                          contexts = out.stdout.strip()
                          protection[name] = contexts if contexts else "unprotected"
                      else:
                          protection[name] = "unknown"
                  except Exception:
                      protection[name] = "unknown"

          report = {}
          if report_path.is_file():
              try: report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception: report = {}
          if not isinstance(report, dict):
              report = {}
          report.setdefault("repos", [])
          # Attach per-repo gate_sha256 / protection onto the entry when one exists.
          by_name = {}
          for r in report.get("repos", []) or []:
              if isinstance(r, dict):
                  by_name[r.get("name")] = r
          for entry_name, ctx in protection.items():
              # name may be a bare "plexus-debug-ui"; the sweep's `name_of` uses the
              # last URL segment, so match on either end.
              target = by_name.get(entry_name)
              if target is None:
                  for r in report.get("repos", []) or []:
                      if isinstance(r, dict) and str(r.get("name", "")).endswith(entry_name):
                          target = r; break
              if target is not None and isinstance(target, dict):
                  target["gate_sha256"] = next(
                      (d["gate_sha256"] for d in drift if d["repo"] == entry_name),
                      target.get("gate_sha256"),
                  )
                  target["protection"] = ctx
          report["drift"] = drift
          report["advisory"] = advisory
          # Bright side marker so the Fail step can read the same data without
          # a second search through the JSON.
          report["drift_has_divergence"] = bool(drift)
          report["advisory_has_entries"] = bool(advisory)

          tmp = report_path.with_suffix(report_path.suffix + ".tmp")
          tmp.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          os.replace(tmp, report_path)

          print(f"[drift] canonical gate sha256 = {canonical}")
          print(f"[drift] drift entries   = {len(drift)}")
          print(f"[drift] advisory entries = {len(advisory)}")
          print(f"[drift] protection readback = {protection or '(no repos)'}")
          for d in drift:
              print(f"[drift] DIVERGENCE {d['repo']}: gate_sha256={d['gate_sha256'] or 'MISSING'} "
                    f"expected={d['expected']}")
          for a in advisory:
              print(f"[drift] ADVISORY   {a['repo']}: {a['file']}:{a['line']}")
          PY

      - name: Redacted report artifact (locations only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-fleet-report
          path: ${{ runner.temp }}/fleet-report.json
          retention-days: 90

      - name: Commit the report (the trend line lives in git)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/fleet-report.json" ] || { echo "no report; nothing to commit"; exit 0; }
          mkdir -p docs/qa/fleet-sweeps
          DATE="$(date -u +%F)"
          cp "$RUNNER_TEMP/fleet-report.json" "docs/qa/fleet-sweeps/${DATE}.json"
          git config user.name "devgate-sweep[bot]"
          git config user.email "devgate-sweep[bot]@users.noreply.github.com"
          git add docs/qa/fleet-sweeps/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "fleet sweep ${DATE} (automated)"
            # actions/checkout leaves a detached HEAD, so a bare `git push`
            # fails with "no upstream branch" and the trend line never lands.
            # Push the commit explicitly to the branch that triggered the run.
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Fail loudly and route
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP_RC: ${{ steps.sweep.outputs.rc }}
          REPORT: ${{ runner.temp }}/fleet-report.json
          DRIFT_RC: ${{ steps.drift.outcome }}
        run: |
          set -eu
          MODE="${{ steps.sweep-token.outputs.token_mode }}"
          echo "[fail] token_mode=$MODE (Sprint 0.1 is done when this is app)"
          echo "[fail] sweep rc=$SWEEP_RC drift step outcome=$DRIFT_RC"
          DRIFT_HAS=0
          ADV_HAS=0
          if [ -f "$REPORT" ]; then
            DRIFT_HAS="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(1 if d.get("drift") else 0)' "$REPORT" 2>/dev/null || echo 0)"
            ADV_HAS="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(1 if d.get("advisory") else 0)' "$REPORT" 2>/dev/null || echo 0)"
          fi
          if [ "$DRIFT_HAS" = "1" ] || [ "$ADV_HAS" = "1" ]; then
            echo "FAIL: drift or advisory entries are present (SGR-06/SGR-16)"
            python3 scripts/hub_alert.py --key secret_fleet_sweep --report "$REPORT" || true
            exit 1
          fi
          case "$SWEEP_RC" in
            0)
              if [ "$MODE" != "app" ]; then
                echo "walked clean, but token_mode=$MODE - the full fleet was NOT covered."
                echo "Open Sprint 0.1 (DevGate sweep GitHub App) before treating this as a green run."
                python3 scripts/hub_alert.py --key secret_fleet_sweep \
                  --detail "Sprint 0.1 not done (token_mode=$MODE): the sweep ran with a repo-scoped token and cannot see the owner scope. See docs/qa/fleet-sweeps/ for this run's report." || true
                exit 1
              fi
              echo "fleet clean"
              exit 0 ;;
            1|2|4)
              python3 scripts/hub_alert.py --key secret_fleet_sweep --report "$REPORT" || true
              echo "FAIL: sweep exit $SWEEP_RC"
              exit 1 ;;
            *)
              python3 scripts/hub_alert.py --key secret_fleet_sweep \
                --detail "unexpected secret-scan-fleet.sh exit $SWEEP_RC" || true
              echo "FAIL: unexpected sweep exit $SWEEP_RC"
              exit 1 ;;
          esac